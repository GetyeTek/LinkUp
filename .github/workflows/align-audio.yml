name: 2. Align Audio & Cues (Transcribe)

on:
  workflow_dispatch:
    inputs:
      target_lesson_id:
        description: 'Target Lesson ID (paste UUID to align only this lesson, leave empty for queue)'
        required: false
        default: ''
      batch_size:
        description: 'Number of lessons to process'
        required: false
        default: '5'

jobs:
  align-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install @supabase/supabase-js ws

      - name: Execute Acoustic Alignment Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_LESSON_ID: ${{ github.event.inputs.target_lesson_id || '' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || 5 }}
        run: node scripts/align-audio.mjs