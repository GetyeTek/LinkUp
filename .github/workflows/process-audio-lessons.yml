name: Process Audio Lessons

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of pending lessons to process'
        required: false
        default: '5'
      target_lesson_id:
        description: 'Target Lesson ID (paste UUID to process only this lesson, leave empty for queue)'
        required: false
        default: ''
      force_retranscribe:
        description: 'Re-transcribe & align cues only (reuses existing audio, ignores status) (true/false)'
        required: false
        default: 'false'
      force_regenerate_audio:
        description: 'Force re-generate TTS audio from scratch (true/false)'
        required: false
        default: 'false'
      force_retry_failed:
        description: 'Include failed lessons in batch (true/false)'
        required: false
        default: 'false'
      batch_size:
        description: 'Number of lessons to process'
        required: false
        default: '5'

jobs:
  process-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours execution cap

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Script Dependencies
        run: npm install @supabase/supabase-js ws

      - name: Execute Audio Processing Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_LESSON_ID: ${{ github.event.inputs.target_lesson_id || '' }}
          FORCE_RETRANSCRIBE: ${{ github.event.inputs.force_retranscribe || 'false' }}
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate_audio || 'false' }}
          FORCE_RETRY: ${{ github.event.inputs.force_retry_failed || 'false' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || 5 }}
        run: node scripts/process-audio-lessons.mjs