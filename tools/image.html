<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge Image Studio - Workers AI</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --card-border: #1e293b;
      --accent: #f38020;
      --accent-hover: #fa9746;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #ff5100);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fff;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .badge {
      background: #1e293b;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      color: var(--accent);
      border: 1px solid rgba(243, 128, 32, 0.3);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 640px) {
      .settings-grid {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .range-control {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .range-control input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .step-display {
      font-weight: 700;
      color: var(--accent);
      min-width: 24px;
      text-align: right;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button {
      cursor: pointer;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      flex: 1;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 0 15px rgba(243, 128, 32, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #1e293b;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #334155;
    }

    .preview-box {
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070a13;
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    .preview-placeholder {
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
      padding: 2rem;
    }

    .preview-img {
      max-width: 100%;
      height: auto;
      display: none;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(243, 128, 32, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .preview-footer {
      display: none;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo">⚡</div>
        <h1>Edge Image Studio</h1>
      </div>
      <span class="badge">FLUX.1 [schnell]</span>
    </header>

    <div class="card">
      <div class="settings-grid">
        <div>
          <label for="workerUrl">Cloudflare Worker Endpoint</label>
          <input type="text" id="workerUrl" placeholder="https://image-gen-worker.your-subdomain.workers.dev" />
        </div>
        <div>
          <label for="authKey">Auth Key (Optional)</label>
          <input type="text" id="authKey" placeholder="Leave blank if no AUTH_KEY set on worker" />
        </div>
      </div>
    </div>

    <div class="card">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="A futuristic cyberpunk market at midnight with neon rain reflections, ultra-detailed..."></textarea>
      
      <div style="margin-top: 1rem;">
        <label for="steps">Inference Steps (1-8): <span id="stepVal" class="step-display">4</span></label>
        <div class="range-control">
          <input type="range" id="steps" min="1" max="8" value="4" />
        </div>
      </div>

      <div class="actions">
        <button id="generateBtn" class="btn-primary">
          <span id="btnText">Generate Image</span>
        </button>
        <button id="randomBtn" class="btn-secondary" title="Surprise me with a random prompt">🎲 Surprise</button>
      </div>
    </div>

    <div id="alertBox" class="alert alert-error"></div>

    <div class="card">
      <div class="preview-box">
        <div id="spinner" class="spinner"></div>
        <div id="placeholder" class="preview-placeholder">
          Generated artwork will render here.<br>Edge inference typically takes 2-4 seconds.
        </div>
        <img id="previewImage" class="preview-img" alt="AI Generated Output" />
      </div>

      <div id="previewFooter" class="preview-footer">
        <span id="genInfo" style="font-size: 0.85rem; color: var(--muted);"></span>
        <button id="downloadBtn" class="btn-secondary">⬇ Download JPEG</button>
      </div>
    </div>
  </div>

  <script>
    const PROMPTS = [
      "A cinematic shot of a mechanical cyber-panther stalking through foggy neon-lit Tokyo backstreets, 8k resolution, Unreal Engine 5 render.",
      "An ethereal floating archipelago with cascading waterfalls into cloud banks, hyper-detailed fantasy landscape, golden hour glow.",
      "A retro-futuristic cozy coffee shop on Mars, dust storms visible through the observation glass, warm incandescent lighting.",
      "Macro shot of an intricate glass mechanical hummingbird drinking liquid starlight, refraction, hyper-realistic, octane render."
    ];

    const workerUrlInput = document.getElementById("workerUrl");
    const authKeyInput = document.getElementById("authKey");
    const promptInput = document.getElementById("prompt");
    const stepsInput = document.getElementById("steps");
    const stepValDisplay = document.getElementById("stepVal");
    const generateBtn = document.getElementById("generateBtn");
    const btnText = document.getElementById("btnText");
    const randomBtn = document.getElementById("randomBtn");
    const previewImage = document.getElementById("previewImage");
    const spinner = document.getElementById("spinner");
    const placeholder = document.getElementById("placeholder");
    const alertBox = document.getElementById("alertBox");
    const previewFooter = document.getElementById("previewFooter");
    const genInfo = document.getElementById("genInfo");
    const downloadBtn = document.getElementById("downloadBtn");

    let currentBlobUrl = null;

    // Load saved preferences
    workerUrlInput.value = localStorage.getItem("cf_worker_url") || "";
    authKeyInput.value = localStorage.getItem("cf_auth_key") || "";

    workerUrlInput.addEventListener("change", () => {
      localStorage.setItem("cf_worker_url", workerUrlInput.value.trim());
    });

    authKeyInput.addEventListener("change", () => {
      localStorage.setItem("cf_auth_key", authKeyInput.value.trim());
    });

    stepsInput.addEventListener("input", (e) => {
      stepValDisplay.textContent = e.target.value;
    });

    randomBtn.addEventListener("click", () => {
      const idx = Math.floor(Math.random() * PROMPTS.length);
      promptInput.value = PROMPTS[idx];
    });

    function showError(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = "block";
    }

    function clearError() {
      alertBox.textContent = "";
      alertBox.style.display = "none";
    }

    generateBtn.addEventListener("click", async () => {
      clearError();
      const endpoint = workerUrlInput.value.trim();
      const prompt = promptInput.value.trim();
      const key = authKeyInput.value.trim();
      const steps = parseInt(stepsInput.value, 10);

      if (!endpoint) {
        showError("Please specify your deployed Cloudflare Worker URL above.");
        workerUrlInput.focus();
        return;
      }

      if (!prompt) {
        showError("Please enter a prompt describing the image you want.");
        promptInput.focus();
        return;
      }

      generateBtn.disabled = true;
      btnText.textContent = "Synthesizing...";
      spinner.style.display = "block";
      placeholder.style.display = "none";
      previewImage.style.display = "none";
      previewFooter.style.display = "none";

      const startTime = performance.now();

      try {
        const headers = { "Content-Type": "application/json" };
        if (key) {
          headers["X-Auth-Key"] = key;
        }

        const res = await fetch(endpoint, {
          method: "POST",
          headers: headers,
          body: JSON.stringify({ prompt, steps })
        });

        if (!res.ok) {
          let errText = "Inference request failed (" + res.status + ")";
          try {
            const errJson = await res.json();
            if (errJson.error) errText = errJson.error;
          } catch {
            const raw = await res.text();
            if (raw) errText = raw;
          }
          throw new Error(errText);
        }

        const blob = await res.blob();
        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl);
        }
        currentBlobUrl = URL.createObjectURL(blob);
        previewImage.src = currentBlobUrl;
        previewImage.style.display = "block";

        const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
        genInfo.textContent = `Completed in ${elapsed}s • Steps: ${steps}`;
        previewFooter.style.display = "flex";
      } catch (err) {
        showError(err.message || "Failed to reach edge worker. Check CORS or URL.");
        placeholder.style.display = "block";
      } finally {
        spinner.style.display = "none";
        generateBtn.disabled = false;
        btnText.textContent = "Generate Image";
      }
    });

    downloadBtn.addEventListener("click", () => {
      if (!currentBlobUrl) return;
      const a = document.createElement("a");
      a.href = currentBlobUrl;
      const cleanSlug = (promptInput.value.slice(0, 30) || "flux-image")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-");
      a.download = `${cleanSlug}-${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
</body>
</html>
