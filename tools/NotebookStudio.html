<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LinkUp: Visual Notebook Studio</title>

    <!-- Typography & Icons (Ethiopic & Latin) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abyssinica+SIL&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- KaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    
    <!-- Sanitizer & Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #09090b;
            --surface: #141418;
            --surface-elevated: #1e1e24;
            --border: rgba(255, 255, 255, 0.09);
            --accent-teal: #42d7b8;
            --accent-teal-soft: rgba(66, 215, 184, 0.12);
            --text-main: #f4f4f5;
            --text-muted: #8e8e93;
            --danger: #ef4444;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Sans Ethiopic', 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Ethiopic typographic optimization */
        .v-notebook-sheet {
            font-family: 'Noto Sans Ethiopic', 'Abyssinica SIL', sans-serif;
            line-height: 1.75;
        }

        /* Top Mobile Bar */
        .mobile-header {
            padding-top: calc(8px + var(--safe-top));
            height: calc(56px + var(--safe-top));
            background: rgba(18, 18, 22, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 1rem;
            padding-right: 1rem;
            flex-shrink: 0;
            z-index: 50;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: -0.3px;
        }

        .brand-box i {
            color: var(--accent-teal);
            font-size: 1.15rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.1);
        }

        .badge-dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-teal);
        }

        /* Viewport Container */
        .studio-main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .tab-view {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(85px + var(--safe-bottom));
        }

        .tab-view.active { display: flex; }

        /* Bottom Tab Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(58px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(14, 14, 18, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 60;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 600;
            gap: 3px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .nav-item i { font-size: 1.1rem; }
        .nav-item.active { color: var(--accent-teal); }

        /* Ingest Screen */
        .ingest-flow {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .compact-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .card-header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header-bar h3 {
            font-size: 0.88rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .textarea-input {
            width: 100%;
            height: 180px;
            background: #09090b;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.8rem;
            resize: vertical;
            outline: none;
            transition: border 0.2s ease;
            line-height: 1.45;
        }

        .textarea-input:focus { border-color: var(--accent-teal); }

        .btn-group-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-core {
            border: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn-core:active { transform: scale(0.97); }
        .btn-core:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary { background: var(--accent-teal); color: #09090b; }
        .btn-secondary { background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text-main); }

        /* Staged List Cards */
        .staged-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .staged-tile {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent-teal);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .tile-meta h4 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
            line-height: 1.3;
        }

        .tile-meta p {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: 'Roboto Mono', monospace;
        }

        /* LIVE SIMULATOR VIEW */
        .preview-sticky-bar {
            position: sticky;
            top: 0;
            background: rgba(14, 14, 18, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            z-index: 20;
            -webkit-overflow-scrolling: touch;
        }

        .preview-sticky-bar::-webkit-scrollbar { display: none; }

        .pill-chip {
            padding: 6px 14px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .pill-chip.active {
            background: var(--accent-teal-soft);
            border-color: var(--accent-teal);
            color: var(--accent-teal);
        }

        .preview-content-box {
            padding: 0.5rem 0.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Rendered Visual Sheet Wrapping - Unconstrained Canvas */
        .v-notebook-sheet {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .v-sheet-anchor-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 99px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .anchor-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-teal);
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }

        .v-bento-canvas {
            width: 100%;
            border-radius: 0;
            overflow: visible;
            background: transparent;
        }

        /* Responsive Safety Defaults for Rendered Content */
        .v-bento-canvas table {
            display: block;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 0;
            margin: 0.5em 0;
            -webkit-overflow-scrolling: touch;
        }

        /* MODALS & BOTTOM SHEETS */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .bottom-sheet {
            width: 100%;
            max-width: 550px;
            background: #141418;
            border: 1px solid var(--border);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 1.25rem 1.25rem calc(1.5rem + var(--safe-bottom));
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 85dvh;
            overflow-y: auto;
        }

        .modal-overlay.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 99px;
            margin: 0 auto 4px auto;
        }

        .sheet-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sheet-title-bar h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-group label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-dark {
            width: 100%;
            background: #09090b;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.8rem;
            outline: none;
        }

        .input-dark:focus { border-color: var(--accent-teal); }

        .terminal-feed {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.72rem;
            color: var(--accent-teal);
            height: 220px;
            overflow-y: auto;
            line-height: 1.45;
        }

        .terminal-feed p { margin-bottom: 4px; word-break: break-word; }
        .term-err { color: #f87171; }
        .term-warn { color: #fbbf24; }

        /* Toast Banner */
        .toast-banner {
            position: fixed;
            top: calc(65px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(20, 20, 25, 0.96);
            border: 1px solid var(--accent-teal);
            color: #fff;
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 200;
        }

        .toast-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Mobile Topbar -->
    <header class="mobile-header">
        <div class="brand-box">
            <i class="fas fa-layer-group"></i>
            <span>Visual Studio</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="openModal('modal-terminal')" title="Console Logs">
                <i class="fas fa-terminal"></i>
                <span class="badge-dot" id="log-indicator" style="display: none;"></span>
            </button>
            <button class="icon-btn" onclick="openModal('modal-settings')" title="Supabase Keys">
                <i class="fas fa-sliders"></i>
            </button>
        </div>
    </header>

    <!-- Main Viewport -->
    <main class="studio-main">
        
        <!-- VIEW 1: INGEST & STAGE -->
        <section class="tab-view active" id="view-ingest">
            <div class="ingest-flow">
                
                <!-- XML Input Card -->
                <div class="compact-card">
                    <div class="card-header-bar">
                        <h3><i class="fas fa-code"></i> AI XML Payload</h3>
                        <button class="pill-chip" onclick="pasteFromClipboard()">
                            <i class="fas fa-paste"></i> Paste
                        </button>
                    </div>

                    <textarea id="raw-input" class="textarea-input" placeholder="Paste <notebook_sheet> blocks here..."></textarea>

                    <div class="btn-group-row">
                        <button class="btn-core btn-primary" onclick="parseSheets()">
                            <i class="fas fa-wand-magic-sparkles"></i> Parse Sheets
                        </button>
                        <button class="btn-core btn-secondary" onclick="clearInput()">
                            <i class="fas fa-trash-can"></i> Clear
                        </button>
                    </div>
                </div>

                <!-- Staged Ledger -->
                <div class="compact-card">
                    <div class="card-header-bar">
                        <h3><i class="fas fa-list-check"></i> Staged Sheets (<span id="staged-count-label">0</span>)</h3>
                        <button id="btn-upsert-all" class="pill-chip" style="color: var(--accent-teal);" onclick="uploadAllSheets()" disabled>
                            <i class="fas fa-cloud-arrow-up"></i> Upsert All
                        </button>
                    </div>

                    <div class="staged-list-container" id="staged-container">
                        <div style="text-align: center; color: var(--text-muted); padding: 1.5rem; font-size: 0.8rem; font-style: italic;">
                            No sheets staged. Paste XML above and tap "Parse Sheets".
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- VIEW 2: LIVE SIMULATOR -->
        <section class="tab-view" id="view-preview">
            <div class="preview-sticky-bar" id="preview-pills"></div>

            <div class="preview-content-box">
                <div id="preview-viewport" style="width: 100%;">
                    <!-- Rendered Sheet Canvas -->
                </div>

                <!-- Single Sheet Action -->
                <div style="width: 100%; max-width: 620px; margin-top: 1.5rem;" id="single-approve-wrap">
                    <button class="btn-core btn-primary" style="width: 100%;" onclick="uploadActiveSheet()">
                        <i class="fas fa-cloud-arrow-up"></i> Publish Active Sheet
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('ingest')" id="nav-btn-ingest">
            <i class="fas fa-file-code"></i>
            <span>Ingest</span>
        </button>
        <button class="nav-item" onclick="switchTab('preview')" id="nav-btn-preview">
            <i class="fas fa-mobile-screen"></i>
            <span>Preview (<span id="nav-sheet-count">0</span>)</span>
        </button>
    </nav>

    <!-- DRAWER: SETTINGS -->
    <div class="modal-overlay" id="modal-settings" onclick="closeModalOnBackdrop(event, 'modal-settings')">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-title-bar">
                <h3><i class="fas fa-database"></i> Database Credentials</h3>
                <button class="icon-btn" onclick="closeModal('modal-settings')"><i class="fas fa-xmark"></i></button>
            </div>
            
            <div class="field-group">
                <label>Supabase URL</label>
                <input type="text" id="sb-url" class="input-dark" placeholder="https://xyz.supabase.co">
            </div>

            <div class="field-group">
                <label>Supabase Service/Anon Key</label>
                <input type="password" id="sb-key" class="input-dark" placeholder="eyJhbGciOi...">
            </div>

            <button class="btn-core btn-primary" onclick="saveCredentials()">
                <i class="fas fa-floppy-disk"></i> Save Credentials
            </button>
        </div>
    </div>

    <!-- DRAWER: CONSOLE -->
    <div class="modal-overlay" id="modal-terminal" onclick="closeModalOnBackdrop(event, 'modal-terminal')">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-title-bar">
                <h3><i class="fas fa-terminal"></i> Studio Console</h3>
                <button class="icon-btn" onclick="clearLogs()"><i class="fas fa-broom"></i></button>
            </div>

            <div class="terminal-feed" id="terminal-feed">
                <p>> Studio console ready.</p>
            </div>

            <button class="btn-core btn-secondary" onclick="closeModal('modal-terminal')">
                Close Console
            </button>
        </div>
    </div>

    <!-- Injected Dynamic CSS -->
    <style id="preview-scoped-css"></style>

    <!-- Toast Banner -->
    <div class="toast-banner" id="toast-banner">
        <i class="fas fa-circle-info" id="toast-icon"></i>
        <span id="toast-msg">Notice</span>
    </div>

    <script>
        // STRICT COURSE CODE CANONICAL LIST
        const VALID_COURSE_CODES = [
            "ANTH 1012",
            "BIOL 1012",
            "CHEM 1012",
            "ECON 1011",
            "EMTE 1012",
            "FLEN 1011",
            "FLEN 1012",
            "GEES 1011",
            "GLTR 2012",
            "HIST 1012",
            "INCL 1012",
            "LOCT 1011",
            "MATH 1011",
            "MATH 1012",
            "MCIE 1012",
            "MGMT 1012",
            "PSYC 1011",
            "SPSC 1011"
        ];

        let parsedSheets = [];
        let activeSheetIndex = 0;

        // Auto-load saved credentials
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = sessionStorage.getItem('linkup_sb_url') || localStorage.getItem('linkup_sb_url');
            const savedKey = sessionStorage.getItem('linkup_sb_key') || localStorage.getItem('linkup_sb_key');
            if (savedUrl) document.getElementById('sb-url').value = savedUrl;
            if (savedKey) document.getElementById('sb-key').value = savedKey;
        });

        // Toast Feedback
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast-banner');
            const msgEl = document.getElementById('toast-msg');
            const icon = document.getElementById('toast-icon');

            msgEl.innerText = message;
            icon.className = isError ? "fas fa-triangle-exclamation text-danger" : "fas fa-circle-check";
            toast.style.borderColor = isError ? "var(--danger)" : "var(--accent-teal)";
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2600);
        }

        // Terminal Log Dispatcher
        function log(msg, type = 'info') {
            const feed = document.getElementById('terminal-feed');
            const p = document.createElement('p');
            p.innerText = `> ${msg}`;
            if (type === 'err') p.className = 'term-err';
            if (type === 'warn') p.className = 'term-warn';
            feed.appendChild(p);
            feed.scrollTop = feed.scrollHeight;
            document.getElementById('log-indicator').style.display = 'block';
        }

        function clearLogs() {
            document.getElementById('terminal-feed').innerHTML = '<p>> Console cleared.</p>';
        }

        // Bottom Sheets / Modals Management
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            if (id === 'modal-terminal') {
                document.getElementById('log-indicator').style.display = 'none';
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function closeModalOnBackdrop(event, id) {
            if (event.target.id === id) closeModal(id);
        }

        function saveCredentials() {
            const url = document.getElementById('sb-url').value.trim();
            const key = document.getElementById('sb-key').value.trim();
            if (!url || !key) {
                showToast("Please fill both URL & Key", true);
                return;
            }
            sessionStorage.setItem('linkup_sb_url', url);
            sessionStorage.setItem('linkup_sb_key', key);
            localStorage.setItem('linkup_sb_url', url);
            localStorage.setItem('linkup_sb_key', key);
            closeModal('modal-settings');
            showToast("Database keys stored");
            log("Supabase credentials configured.");
        }

        function switchTab(target) {
            document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            if (target === 'ingest') {
                document.getElementById('view-ingest').classList.add('active');
                document.getElementById('nav-btn-ingest').classList.add('active');
            } else {
                document.getElementById('view-preview').classList.add('active');
                document.getElementById('nav-btn-preview').classList.add('active');
                renderPreview();
            }
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('raw-input').value = text;
                    showToast("Pasted from clipboard");
                }
            } catch (err) {
                showToast("Long press inside the box to paste", true);
            }
        }

        function clearInput() {
            document.getElementById('raw-input').value = '';
            parsedSheets = [];
            updateStagedList();
            showToast("Cleared input");
        }

        // STRICT COURSE CODE NORMALIZER
        function normalizeCourseCode(raw) {
            if (!raw) return "ANTH 1012";
            const cleaned = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');

            // 1. Direct match check
            for (const code of VALID_COURSE_CODES) {
                if (cleaned === code.replace(/\s+/g, '')) return code;
            }

            const letters = cleaned.replace(/[^A-Z]/g, '');
            const digits = cleaned.replace(/[^0-9]/g, '');

            // 2. Multi-Semester Courses disambiguation (FLEN & MATH)
            if (letters.startsWith('FLEN') || letters.startsWith('FLE')) {
                return (digits.includes('12') || digits.endsWith('2')) ? 'FLEN 1012' : 'FLEN 1011';
            }
            if (letters.startsWith('MATH') || letters.startsWith('MAT')) {
                return (digits.includes('12') || digits.endsWith('2')) ? 'MATH 1012' : 'MATH 1011';
            }

            // 3. Department Prefix Mapping
            const prefixMap = {
                'ANTH': 'ANTH 1012', 'ANT': 'ANTH 1012',
                'BIOL': 'BIOL 1012', 'BIO': 'BIOL 1012',
                'CHEM': 'CHEM 1012', 'CHM': 'CHEM 1012',
                'ECON': 'ECON 1011', 'ECO': 'ECON 1011',
                'EMTE': 'EMTE 1012', 'EMT': 'EMTE 1012',
                'GEES': 'GEES 1011', 'GEE': 'GEES 1011', 'GEO': 'GEES 1011',
                'GLTR': 'GLTR 2012', 'GLT': 'GLTR 2012',
                'HIST': 'HIST 1012', 'HIS': 'HIST 1012',
                'INCL': 'INCL 1012', 'INC': 'INCL 1012',
                'LOCT': 'LOCT 1011', 'LOC': 'LOCT 1011', 'LOG': 'LOCT 1011',
                'MCIE': 'MCIE 1012', 'MCI': 'MCIE 1012', 'CIV': 'MCIE 1012',
                'MGMT': 'MGMT 1012', 'MGM': 'MGMT 1012', 'MAN': 'MGMT 1012',
                'PSYC': 'PSYC 1011', 'PSY': 'PSYC 1011',
                'SPSC': 'SPSC 1011', 'SPS': 'SPSC 1011', 'SPO': 'SPSC 1011'
            };

            for (const [prefix, target] of Object.entries(prefixMap)) {
                if (letters.startsWith(prefix)) return target;
            }

            // Fallback substring search
            const match = VALID_COURSE_CODES.find(c => c.replace(/\s+/g, '').includes(letters));
            return match || "ANTH 1012";
        }

        // ULTRA-ROBUST XML PARSER
        function parseSheets() {
            const raw = document.getElementById('raw-input').value.trim();
            if (!raw) {
                showToast("Input is empty", true);
                return;
            }

            const sheetRegex = /<notebook_sheet\s+([^>]*?)>([\s\S]*?)<\/notebook_sheet>/gi;
            const matches = [...raw.matchAll(sheetRegex)];

            if (matches.length === 0) {
                showToast("No <notebook_sheet> blocks found", true);
                log("Parse failed: Check that XML wraps with <notebook_sheet>", "warn");
                return;
            }

            parsedSheets = [];

            matches.forEach((match) => {
                const attrStr = match[1];
                const inner = match[2];

                // Course Code Extraction & Normalization
                const courseMatch = attrStr.match(/course\s*=\s*['"]([^'"]+)['"]/i);
                const rawCourse = courseMatch ? courseMatch[1] : "ANTH 1012";
                const canonicalCourse = normalizeCourseCode(rawCourse);

                if (rawCourse !== canonicalCourse) {
                    log(`Normalized code: "${rawCourse}" → "${canonicalCourse}"`);
                }

                // Page Number Extraction
                const pageMatch = attrStr.match(/page\s*=\s*['"]([^'"]+)['"]/i);
                const page = pageMatch ? parseInt(pageMatch[1], 10) : 1;

                // Title Extraction
                const titleMatch = inner.match(/<title>([\s\S]*?)<\/title>/i);
                const title = titleMatch ? titleMatch[1].trim() : "Untitled Study Sheet";

                // CSS Extraction
                const cssMatch = inner.match(/<scoped_css>([\s\S]*?)<\/scoped_css>/i);
                const css = cssMatch ? cssMatch[1].trim() : "";

                // Body Extraction (Universal: matches <html>, <content>, <body>, or post-CSS block)
                let body = "";
                const bodyMatch = inner.match(/<html[\s\S]*?>([\s\S]*?)<\/html>/i) 
                               || inner.match(/<content[\s\S]*?>([\s\S]*?)<\/content>/i)
                               || inner.match(/<body[\s\S]*?>([\s\S]*?)<\/body>/i);

                if (bodyMatch) {
                    body = bodyMatch[1].trim();
                } else if (cssMatch) {
                    // Fallback: take content after scoped_css tag
                    const postCss = inner.split(/<\/scoped_css>/i)[1];
                    if (postCss) body = postCss.replace(/<\/notebook_sheet>/i, '').trim();
                }

                if (!body) {
                    log(`Warning: Sheet p.${page} has no body HTML content.`, "warn");
                }

                // Extract language with Amharic (am) default
                const langMatch = attrStr.match(/lang\s*=\s*['"]([^'"]+)['"]/i);
                const rawLang = langMatch ? langMatch[1].toLowerCase().trim() : "am";

                parsedSheets.push({
                    course_code: canonicalCourse,
                    language: rawLang || "am",
                    page_number: isNaN(page) ? 1 : page,
                    topic_title: title,
                    scoped_css: css,
                    html_body: body
                });
            });

            log(`Successfully parsed ${parsedSheets.length} sheet(s).`);
            showToast(`Parsed ${parsedSheets.length} sheet(s)`);
            updateStagedList();
        }

        function updateStagedList() {
            const container = document.getElementById('staged-container');
            const countLabel = document.getElementById('staged-count-label');
            const navCount = document.getElementById('nav-sheet-count');
            const upsertAllBtn = document.getElementById('btn-upsert-all');

            countLabel.innerText = parsedSheets.length;
            navCount.innerText = parsedSheets.length;

            if (parsedSheets.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 1.5rem; font-size: 0.8rem; font-style: italic;">No sheets staged. Paste XML above and tap "Parse Sheets".</div>`;
                upsertAllBtn.disabled = true;
                return;
            }

            upsertAllBtn.disabled = false;

            container.innerHTML = parsedSheets.map((sheet, index) => `
                <div class="staged-tile">
                    <div class="tile-meta">
                        <h4>${sheet.topic_title}</h4>
                        <p>${sheet.course_code} • Page ${sheet.page_number}</p>
                    </div>
                    <button class="pill-chip" onclick="previewSingleSheet(${index})">
                        <i class="fas fa-eye"></i> View
                    </button>
                </div>
            `).join('');
        }

        function previewSingleSheet(index) {
            activeSheetIndex = index;
            switchTab('preview');
        }

        // SIMULATOR RENDERING
        function renderPreview() {
            const viewport = document.getElementById('preview-viewport');
            const pillsBar = document.getElementById('preview-pills');
            const styleTag = document.getElementById('preview-scoped-css');
            const approveWrap = document.getElementById('single-approve-wrap');

            if (parsedSheets.length === 0) {
                viewport.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); padding: 3rem 1rem; font-size: 0.85rem;">
                        <i class="fas fa-layer-group" style="font-size: 2rem; margin-bottom: 12px; display: block; opacity: 0.3;"></i>
                        No sheets staged to preview.<br>Go to <strong>Ingest</strong> tab to parse content.
                    </div>`;
                pillsBar.innerHTML = '';
                styleTag.textContent = '';
                approveWrap.style.display = 'none';
                return;
            }

            approveWrap.style.display = 'block';

            pillsBar.innerHTML = parsedSheets.map((s, idx) => `
                <div class="pill-chip ${idx === activeSheetIndex ? 'active' : ''}" onclick="selectPreviewSheet(${idx})">
                    p.${s.page_number} - ${s.course_code}
                </div>
            `).join('');

            const sheet = parsedSheets[activeSheetIndex];
            styleTag.textContent = sheet.scoped_css || '';

            viewport.innerHTML = `
                <article class="v-notebook-sheet">
                    <div class="v-sheet-anchor-bar">
                        <span class="anchor-pill">
                            <i class="fas fa-bookmark"></i> Page ${sheet.page_number}
                        </span>
                        <span>${sheet.course_code}</span>
                    </div>
                    <div class="v-bento-canvas">
                        ${DOMPurify.sanitize(sheet.html_body, { USE_PROFILES: { html: true, svg: true, mathMl: true } })}
                    </div>
                </article>
            `;

            // Render LaTeX formulas
            renderMathInElement(viewport, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "\\[", right: "\\]", display: true },
                    { left: "$", right: "$", display: false },
                    { left: "\\(", right: "\\)", display: false }
                ],
                throwOnError: false
            });
        }

        function selectPreviewSheet(idx) {
            activeSheetIndex = idx;
            renderPreview();
        }

        // SUPABASE SYNC
        function getSupabaseClient() {
            const url = document.getElementById('sb-url').value.trim() || sessionStorage.getItem('linkup_sb_url');
            const key = document.getElementById('sb-key').value.trim() || sessionStorage.getItem('linkup_sb_key');

            if (!url || !key) {
                openModal('modal-settings');
                showToast("Enter Supabase credentials first", true);
                return null;
            }

            return window.supabase.createClient(url, key);
        }

        async function uploadActiveSheet() {
            const client = getSupabaseClient();
            if (!client || !parsedSheets[activeSheetIndex]) return;

            const sheet = parsedSheets[activeSheetIndex];
            log(`Publishing ${sheet.course_code} p.${sheet.page_number}...`);
            showToast("Publishing sheet...");

            try {
                const { error } = await client
                    .from('course_visual_notebooks')
                    .upsert({
                        course_code: sheet.course_code,
                        language: sheet.language || 'am',
                        page_number: sheet.page_number,
                        topic_title: sheet.topic_title,
                        scoped_css: sheet.scoped_css,
                        html_body: sheet.html_body,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'course_code, language, page_number' });

                if (error) throw error;
                log(`✅ Published: ${sheet.course_code} (p. ${sheet.page_number})`);
                showToast(`${sheet.course_code} p.${sheet.page_number} published!`);
            } catch (err) {
                log(`Publish Failed: ${err.message}`, 'err');
                showToast(`Upload failed: ${err.message}`, true);
            }
        }

        async function uploadAllSheets() {
            const client = getSupabaseClient();
            if (!client || parsedSheets.length === 0) return;

            const btn = document.getElementById('btn-upsert-all');
            btn.disabled = true;
            log(`Starting batch upload of ${parsedSheets.length} sheet(s)...`);
            showToast(`Uploading ${parsedSheets.length} sheets...`);

            try {
                for (let i = 0; i < parsedSheets.length; i++) {
                    const sheet = parsedSheets[i];
                    log(`Processing (${i + 1}/${parsedSheets.length}): ${sheet.course_code} p.${sheet.page_number}...`);

                    const { error } = await client
                        .from('course_visual_notebooks')
                        .upsert({
                            course_code: sheet.course_code,
                            language: sheet.language || 'am',
                            page_number: sheet.page_number,
                            topic_title: sheet.topic_title,
                            scoped_css: sheet.scoped_css,
                            html_body: sheet.html_body,
                            updated_at: new Date().toISOString()
                        }, { onConflict: 'course_code, language, page_number' });

                    if (error) throw error;
                }

                log(`✅ Batch complete: All ${parsedSheets.length} sheets published.`);
                showToast("All sheets uploaded successfully!");
            } catch (err) {
                log(`Batch Error: ${err.message}`, 'err');
                showToast(`Upload failed: ${err.message}`, true);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
