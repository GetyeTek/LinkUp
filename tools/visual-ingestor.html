<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miron Ingestor & Lecture Queue Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090e18;
      --surface: #111827;
      --surface-card: #162032;
      --border: #24324a;
      --blue: #38bdf8;
      --blue-glow: rgba(56, 189, 248, 0.15);
      --green: #10b981;
      --green-dim: rgba(16, 185, 129, 0.12);
      --amber: #f59e0b;
      --red: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      padding: 32px 20px;
      display: flex;
      justify-content: center;
      -webkit-text-size-adjust: 100%;
    }
    .container {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-sizing: border-box;
      min-width: 0;
    }
    .header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      word-break: break-word;
    }
    .header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      word-break: break-word;
    }
    .tabs-nav {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      gap: 8px;
      min-width: 0;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--blue);
      color: #090e18;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.35);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1.2fr 1.8fr 1fr;
      gap: 16px;
    }
    @media (max-width: 720px) {
      body {
        padding: 16px 12px;
      }
      .container {
        gap: 14px;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        padding: 18px 16px;
        gap: 12px;
      }
      .header h1 {
        font-size: 18px;
      }
      .header p {
        font-size: 12px;
      }
      .pill-tip {
        align-self: flex-start;
      }
      .tabs-nav {
        flex-direction: column;
        padding: 4px;
        gap: 4px;
      }
      .tab-btn {
        width: 100%;
        padding: 10px 12px;
        font-size: 12px;
        justify-content: center;
      }
      .card {
        padding: 16px 14px;
        gap: 14px;
        border-radius: 14px;
      }
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      textarea {
        min-height: 200px;
      }
      .btn {
        padding: 12px 16px;
        font-size: 13px;
      }
    }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }
    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 12px var(--blue-glow);
    }
    textarea {
      min-height: 280px;
      resize: vertical;
      line-height: 1.55;
    }
    .btn {
      background: var(--blue);
      color: #090e18;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.btn-green {
      background: var(--green);
      color: #042f2e;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
    }
    .log-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--surface-card);
      border-left: 3px solid var(--blue);
    }
    .log-item.success { border-left-color: var(--green); }
    .log-item.error { border-left-color: var(--red); color: #fca5a5; }
    .status-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
    }
    .pill-tip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green-dim);
      border: 1px solid var(--green);
      color: var(--green);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Universal SVG Design Tokens */
    :root {
      --vis-bg: #090e18;
      --vis-surface: #111827;
      --vis-surface-card: #162032;
      --vis-border: #24324a;
      --vis-border-light: #334464;
      --vis-text: #f8fafc;
      --vis-text-muted: #94a3b8;
      --vis-accent-1: #38bdf8;
      --vis-accent-2: #10b981;
      --vis-accent-3: #f59e0b;
      --vis-accent-4: #a855f7;
      --vis-accent-5: #f43f5e;
    }

    /* Preview Gallery Styles */
    .preview-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .preview-actions-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 8px;
    }
    .view-mode-pill {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 3px;
      gap: 3px;
    }
    .mode-pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-pill-btn.active {
      background: var(--blue);
      color: #090e18;
      font-weight: 800;
    }
    .preview-count-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      background: var(--blue-glow);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .preview-gallery-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }
    .preview-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s;
    }
    .preview-card:hover {
      border-color: var(--blue);
    }
    .preview-card-header {
      padding: 12px 18px;
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .preview-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .preview-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      color: var(--blue);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .preview-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .preview-expand-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #cbd5e1;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .preview-expand-btn:hover {
      background: var(--blue);
      color: #090e18;
      border-color: var(--blue);
      transform: scale(1.08);
    }
    .preview-viewport-frame {
      width: 100%;
      min-height: 240px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .preview-card-footer {
      padding: 10px 16px;
      background: rgba(11, 17, 32, 0.6);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .node-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .node-pill:hover {
      color: var(--blue);
      border-color: var(--blue);
      background: var(--blue-glow);
    }

    /* Topology Dynamic Overrides for Preview Container */
    .preview-viewport-frame[data-topo="desktop"] svg.vis-desktop { display: block !important; width: 100% !important; max-width: 780px !important; height: auto !important; }
    .preview-viewport-frame[data-topo="desktop"] svg.vis-mobile  { display: none !important; }
    .preview-viewport-frame[data-topo="mobile"] svg.vis-desktop  { display: none !important; }
    .preview-viewport-frame[data-topo="mobile"] svg.vis-mobile   { display: block !important; width: 100% !important; max-width: 360px !important; height: auto !important; }

    /* Clean full-bleed SVG render inside preview */
    .preview-viewport-frame .vis-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
      display: flex;
      justify-content: center;
    }
    .preview-viewport-frame .vis-head { display: none !important; }
    .preview-viewport-frame .vis-box {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      width: 100% !important;
      display: flex;
      justify-content: center;
    }

    /* Fullscreen Cinema Modal Overlay */
    .vis-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(9, 14, 24, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .vis-modal-header {
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.95);
    }
    .vis-modal-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .vis-modal-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      color: var(--blue);
      background: var(--blue-glow);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .vis-modal-header h3 {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }
    .vis-modal-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal-close-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.15s;
    }
    .modal-close-btn:hover {
      background: rgba(244, 63, 94, 0.15);
      color: #f43f5e;
    }
    .vis-modal-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }
    .vis-modal-stage .vis-card {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      box-shadow: none !important;
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .vis-modal-stage .vis-head { display: none !important; }
    .vis-modal-stage .vis-box {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
    }
    .vis-modal-stage svg {
      display: block !important;
      transition: viewBox 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .vis-modal-stage[data-topo="desktop"] svg.vis-desktop {
      display: block !important;
      width: 100% !important;
      max-width: 860px !important;
      height: auto !important;
      max-height: calc(100vh - 160px) !important;
    }
    .vis-modal-stage[data-topo="desktop"] svg.vis-mobile {
      display: none !important;
    }
    .vis-modal-stage[data-topo="mobile"] svg.vis-desktop {
      display: none !important;
    }
    .vis-modal-stage[data-topo="mobile"] svg.vis-mobile {
      display: block !important;
      width: 100% !important;
      max-width: 380px !important;
      height: auto !important;
      max-height: calc(100vh - 160px) !important;
    }
    .vis-modal-nodes-bar {
      padding: 10px 24px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
    }
    .vis-modal-nodes-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>⚡ Miron Ingestor & Lecture Queue Studio</h1>
        <p>Direct Supabase REST bridge for visual SVG diagrams and master audio lesson scripts.</p>
      </div>
      <span class="pill-tip">✔ Auto-Saves Credentials</span>
    </div>

    <!-- Credentials Card -->
    <div class="card">
      <div class="grid-2">
        <div>
          <label>Supabase URL</label>
          <input type="text" id="supa-url" placeholder="https://xyz.supabase.co">
        </div>
        <div>
          <label>Supabase Service Role Key</label>
          <input type="password" id="supa-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs-nav">
      <button class="tab-btn active" id="tab-btn-visuals" onclick="switchTab('visuals')">
        🎨 1. Ingest Course Visuals (XML)
      </button>
      <button class="tab-btn" id="tab-btn-script" onclick="switchTab('script')">
        🎙️ 2. Queue Audio Lesson Script
      </button>
      <button class="tab-btn" id="tab-btn-preview" onclick="switchTab('preview')">
        👁️ 3. Visual Gallery & Live Preview
      </button>
    </div>

    <!-- TAB 1: XML VISUALS INGESTION -->
    <div class="card" id="tab-panel-visuals">
      <div>
        <label>Course Visuals XML</label>
        <textarea id="xml-input" placeholder="Paste <course_visuals> XML content here..."></textarea>
      </div>
      <button class="btn" id="btn-ingest-xml" onclick="handleIngestXml()">
        🚀 Parse & Ingest Visuals
      </button>
    </div>

    <!-- TAB 2: MASTER SCRIPT QUEUE -->
    <div class="card" id="tab-panel-script" style="display: none;">
      <div class="grid-3">
        <div>
          <label>Course Code</label>
          <input type="text" id="script-course-code" value="ANTH 1012">
        </div>
        <div>
          <label>Book ID (UUID)</label>
          <input type="text" id="script-book-id" value="d59179fa-23a7-470a-b071-9e632e85e6ae">
        </div>
        <div>
          <label>Start Page</label>
          <input type="number" id="script-page-num" value="11">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Chapter Title</label>
          <input type="text" id="script-chapter-title" value="Unit One: Introducing Anthropology and its Subject Matter">
        </div>
        <div>
          <label>Section Title (Master Track Title)</label>
          <input type="text" id="script-section-title" value="Unit One: Introducing Anthropology and its Subject Matter">
        </div>
      </div>

      <div>
        <label>Master Audio Script (With Section & Visual Cues)</label>
        <textarea id="script-text-input" placeholder="Paste master lecture script here..."></textarea>
      </div>

      <button class="btn btn-green" id="btn-queue-script" onclick="handleQueueScript()">
        ⚡ Queue Audio Lesson for Processing
      </button>
    </div>

    <!-- TAB 3: VISUAL GALLERY & PREVIEW -->
    <div class="card" id="tab-panel-preview" style="display: none;">
      <div class="preview-toolbar">
        <div class="preview-actions-left">
          <button class="btn btn-sm" onclick="renderPreviewFromInput()">
            🔄 Render from XML
          </button>
          <div class="view-mode-pill">
            <button class="mode-pill-btn active" id="btn-topo-desktop" onclick="setPreviewTopology('desktop')">
              💻 Desktop
            </button>
            <button class="mode-pill-btn" id="btn-topo-mobile" onclick="setPreviewTopology('mobile')">
              📱 Mobile
            </button>
          </div>
        </div>
        <span class="preview-count-tag" id="preview-count">0 diagrams loaded</span>
      </div>
      <div class="preview-gallery-grid" id="preview-gallery-container">
        <p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 0;">
          Paste your <course_visuals> XML in Tab 1, then click <strong>Render from XML</strong> to view all rendered graphics.
        </p>
      </div>
    </div>

    <!-- Output Logs Console -->
    <div class="card" id="output-card" style="display: none;">
      <label id="log-summary">Execution Logs</label>
      <div class="log-box" id="log-container"></div>
    </div>
  </div>

  <!-- Fullscreen Immersive Modal (Simulating Miron Live Session Stage) -->
  <div class="vis-modal-overlay" id="vis-modal" style="display: none;">
    <div class="vis-modal-header">
      <div class="vis-modal-meta">
        <span class="vis-modal-badge" id="modal-badge"></span>
        <h3 id="modal-title"></h3>
      </div>
      <div class="vis-modal-actions">
        <div class="view-mode-pill">
          <button class="mode-pill-btn active" id="modal-btn-desktop" onclick="setModalTopology('desktop')">💻 Desktop</button>
          <button class="mode-pill-btn" id="modal-btn-mobile" onclick="setModalTopology('mobile')">📱 Mobile</button>
        </div>
        <button class="modal-close-btn" onclick="closeModal()" title="Close Fullscreen">✕</button>
      </div>
    </div>
    <div class="vis-modal-stage" id="modal-stage" data-topo="desktop"></div>
    <div class="vis-modal-nodes-bar" id="modal-nodes-bar">
      <span class="vis-modal-nodes-label">Camera Nodes:</span>
      <div id="modal-nodes-list" style="display: flex; gap: 6px;"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_URL = 'miron_ingestor_supa_url';
    const STORAGE_KEY_KEY = 'miron_ingestor_supa_key';

    document.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem(STORAGE_KEY_URL);
      const savedKey = localStorage.getItem(STORAGE_KEY_KEY);
      if (savedUrl) document.getElementById('supa-url').value = savedUrl;
      if (savedKey) document.getElementById('supa-key').value = savedKey;
    });

    function getCredentials() {
      const supaUrl = (document.getElementById('supa-url').value || '').trim().replace(/\/$/, '');
      const supaKey = (document.getElementById('supa-key').value || '').trim();

      if (!supaUrl || !supaKey) {
        alert('Please provide your Supabase URL and Service Role Key.');
        return null;
      }

      localStorage.setItem(STORAGE_KEY_URL, supaUrl);
      localStorage.setItem(STORAGE_KEY_KEY, supaKey);
      return { supaUrl, supaKey };
    }

    let activePreviewTopology = 'desktop';
    let cachedParsedVisuals = [];

    function switchTab(mode) {
      document.getElementById('tab-btn-visuals').className = `tab-btn ${mode === 'visuals' ? 'active' : ''}`;
      document.getElementById('tab-btn-script').className = `tab-btn ${mode === 'script' ? 'active' : ''}`;
      document.getElementById('tab-btn-preview').className = `tab-btn ${mode === 'preview' ? 'active' : ''}`;

      document.getElementById('tab-panel-visuals').style.display = mode === 'visuals' ? 'flex' : 'none';
      document.getElementById('tab-panel-script').style.display = mode === 'script' ? 'flex' : 'none';
      document.getElementById('tab-panel-preview').style.display = mode === 'preview' ? 'flex' : 'none';

      if (mode === 'preview' && cachedParsedVisuals.length === 0) {
        renderPreviewFromInput();
      }
    }

    function appendLog(title, subtitle, status) {
      const outputCard = document.getElementById('output-card');
      const container = document.getElementById('log-container');
      outputCard.style.display = 'flex';

      const row = document.createElement('div');
      row.className = `log-item ${status}`;
      row.innerHTML = `
        <span><strong>${title}</strong></span>
        <span class="status-badge">${subtitle}</span>
      `;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    // --- TAB 1: INGEST XML INFOGRAPHICS ---
    async function handleIngestXml() {
      const creds = getCredentials();
      if (!creds) return;

      const rawXml = (document.getElementById('xml-input').value || '').trim();
      if (!rawXml) {
        alert('Please paste the course visuals XML content.');
        return;
      }

      const btn = document.getElementById('btn-ingest-xml');
      const logSummary = document.getElementById('log-summary');
      document.getElementById('log-container').innerHTML = '';
      btn.disabled = true;

      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(rawXml, 'application/xml');

        if (xmlDoc.querySelector('parsererror')) {
          throw new Error('XML parsing failed. Verify that syntax is well-formed.');
        }

        const courseCode = (xmlDoc.querySelector('course_code')?.textContent || 'GENERAL').trim();
        const infographics = Array.from(xmlDoc.querySelectorAll('infographic'));

        if (infographics.length === 0) {
          throw new Error('No <infographic> tags found in XML.');
        }

        logSummary.textContent = `Ingesting ${infographics.length} visual(s) for ${courseCode}...`;

        let count = 0;
        for (let i = 0; i !== infographics.length; i++) {
          const el = infographics[i];
          const id = el.getAttribute('id') || `vis_${Date.now()}_${i}`;
          const title = (el.querySelector('title')?.textContent || el.querySelector('name')?.textContent || id).trim();

          // V3 Taxonomy Parser with V2 Routing Fallback
          const taxNode = el.querySelector('taxonomy');
          let unitNumber = null;
          let sectionTag = null;
          let chapterTitle = null;
          let sectionTitle = null;
          let anchorQuery = null;

          if (taxNode) {
            unitNumber = taxNode.querySelector('unit_number')?.textContent ? parseInt(taxNode.querySelector('unit_number').textContent.trim(), 10) : null;
            sectionTag = taxNode.querySelector('section_tag')?.textContent?.trim() || null;
            chapterTitle = taxNode.querySelector('chapter_title')?.textContent?.trim() || null;
            sectionTitle = taxNode.querySelector('section_title')?.textContent?.trim() || null;
            anchorQuery = taxNode.querySelector('anchor_query')?.textContent?.trim() || null;
          }

          if (!sectionTag) {
            const targetQuery = (el.querySelector('routing > target_query')?.textContent || '').trim();
            const secMatch = targetQuery.match(/^([0-9]+(?:\.[0-9]+)*)/);
            sectionTag = secMatch ? secMatch[1] : null;
            if (!unitNumber && sectionTag) unitNumber = parseInt(sectionTag.split('.')[0], 10);
            anchorQuery = targetQuery;
          }

          const payloadNode = el.querySelector('payload');
          const payloadContent = payloadNode ? payloadNode.textContent.trim() : '';

          // Parse focusable nodes from payload string
          const nodeMatches = Array.from(payloadContent.matchAll(/data-node=["']([^"']+)["']/g)).map(m => m[1]);
          const uniqueNodes = Array.from(new Set(nodeMatches));

          const record = {
            id: id,
            course_code: courseCode,
            asset_type: 'diagram_svg',
            unit_number: unitNumber,
            section_tag: sectionTag,
            title: title,
            content_payload: payloadContent,
            storage_path: null,
            image_url: null,
            metadata: {
              chapter_title: chapterTitle,
              section_title: sectionTitle,
              anchor_query: anchorQuery,
              camera_nodes: uniqueNodes
            },
            updated_at: new Date().toISOString()
          };

          const endpoint = `${creds.supaUrl}/rest/v1/course_visual_assets`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${creds.supaKey}`,
              'apikey': creds.supaKey,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates'
            },
            body: JSON.stringify(record)
          });

          if (!res.ok) {
            const err = await res.text();
            appendLog(`[${i + 1}/${infographics.length}] ${id}`, `Error: ${err}`, 'error');
          } else {
            count++;
            appendLog(`[${i + 1}/${infographics.length}] ${id}`, `Section ${sectionTag || 'N/A'} • Saved`, 'success');
          }
        }

        logSummary.textContent = `Completed: ${count} of ${infographics.length} visuals ingested.`;
      } catch (err) {
        appendLog('Fatal Ingest Error', err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    // --- TAB 3: LIVE PREVIEW & FULLSCREEN CINEMA ENGINE ---
    function renderPreviewFromInput() {
      const rawXml = (document.getElementById('xml-input').value || '').trim();
      const container = document.getElementById('preview-gallery-container');
      const countTag = document.getElementById('preview-count');

      if (!rawXml) {
        container.innerHTML = `
          <p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 0;">
            No XML found. Paste your <course_visuals> XML in Tab 1 first.
          </p>`;
        countTag.textContent = '0 diagrams';
        return;
      }

      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(rawXml, 'application/xml');

        if (xmlDoc.querySelector('parsererror')) {
          throw new Error('XML parsing failed. Verify XML syntax in Tab 1.');
        }

        const infographics = Array.from(xmlDoc.querySelectorAll('infographic'));
        if (infographics.length === 0) {
          throw new Error('No <infographic> tags found in XML.');
        }

        cachedParsedVisuals = infographics.map((el, idx) => {
          const id = el.getAttribute('id') || `vis_${idx}`;
          const title = (el.querySelector('title')?.textContent || el.querySelector('name')?.textContent || id).trim();
          const taxNode = el.querySelector('taxonomy');
          const unitNumber = taxNode?.querySelector('unit_number')?.textContent?.trim() || '';
          const sectionTag = taxNode?.querySelector('section_tag')?.textContent?.trim() || '';
          const payload = el.querySelector('payload')?.textContent?.trim() || '';

          const nodeMatches = Array.from(payload.matchAll(/data-node=["']([^"']+)["']/g)).map(m => m[1]);
          const uniqueNodes = Array.from(new Set(nodeMatches));

          return { id, title, unitNumber, sectionTag, payload, nodes: uniqueNodes };
        });

        countTag.textContent = `${cachedParsedVisuals.length} diagram(s)`;
        container.innerHTML = '';

        cachedParsedVisuals.forEach(v => {
          const card = document.createElement('div');
          card.className = 'preview-card';
          card.innerHTML = `
            <div class="preview-card-header">
              <div class="preview-card-meta">
                <span class="preview-tag">${v.sectionTag ? 'SEC ' + v.sectionTag : (v.unitNumber ? 'UNIT ' + v.unitNumber : 'VIS')}</span>
                <span class="preview-title" title="${v.title}">${v.title}</span>
              </div>
              <button class="preview-expand-btn" onclick="openFullscreenPreview('${v.id}')" title="Full Screen Cinema Preview">
                ⛶
              </button>
            </div>
            <div class="preview-viewport-frame" id="frame-${v.id}" data-topo="${activePreviewTopology}">
              ${v.payload}
            </div>
            <div class="preview-card-footer">
              <span style="font-size:10px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Nodes:</span>
              ${v.nodes.map(n => `<span class="node-pill" onclick="testNodeZoom('${v.id}', '${n}')">${n}</span>`).join('')}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        container.innerHTML = `<div class="log-item error" style="margin: 20px 0;"><span>Error: ${e.message}</span></div>`;
      }
    }

    function setPreviewTopology(topo) {
      activePreviewTopology = topo;
      document.getElementById('btn-topo-desktop').className = `mode-pill-btn ${topo === 'desktop' ? 'active' : ''}`;
      document.getElementById('btn-topo-mobile').className = `mode-pill-btn ${topo === 'mobile' ? 'active' : ''}`;
      document.querySelectorAll('.preview-viewport-frame').forEach(el => {
        el.setAttribute('data-topo', topo);
      });
    }

    // Modal Fullscreen Cinema Viewer
    function openFullscreenPreview(id) {
      const visual = cachedParsedVisuals.find(v => v.id === id);
      if (!visual) return;

      const modal = document.getElementById('vis-modal');
      const stage = document.getElementById('modal-stage');
      const badge = document.getElementById('modal-badge');
      const title = document.getElementById('modal-title');
      const nodesList = document.getElementById('modal-nodes-list');

      badge.textContent = visual.sectionTag ? `SEC ${visual.sectionTag}` : visual.id;
      title.textContent = visual.title;
      stage.innerHTML = visual.payload;
      stage.setAttribute('data-topo', activePreviewTopology);

      setModalTopology(activePreviewTopology);

      // Render camera testing buttons in modal bar
      nodesList.innerHTML = `
        <span class="node-pill" style="color:var(--blue); border-color:var(--blue);" onclick="resetModalCamera()">↺ Overview</span>
        ${visual.nodes.map(n => `<span class="node-pill" onclick="zoomModalNode('${n}')">${n}</span>`).join('')}
      `;

      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('vis-modal').style.display = 'none';
      document.getElementById('modal-stage').innerHTML = '';
      document.body.style.overflow = '';
    }

    function setModalTopology(topo) {
      const stage = document.getElementById('modal-stage');
      stage.setAttribute('data-topo', topo);
      document.getElementById('modal-btn-desktop').className = `mode-pill-btn ${topo === 'desktop' ? 'active' : ''}`;
      document.getElementById('modal-btn-mobile').className = `mode-pill-btn ${topo === 'mobile' ? 'active' : ''}`;
    }

    // Simulate Miron Steadicam Camera Zoom using pre-baked data-focus-box
    function zoomModalNode(nodeSlug) {
      const stage = document.getElementById('modal-stage');
      const currentTopo = stage.getAttribute('data-topo') || 'desktop';
      const activeSvg = currentTopo === 'mobile'
        ? (stage.querySelector('svg.vis-mobile') || stage.querySelector('svg'))
        : (stage.querySelector('svg.vis-desktop') || stage.querySelector('svg'));

      if (!activeSvg) return;

      const targetEl = activeSvg.querySelector(`[data-node="${nodeSlug}"]`) || stage.querySelector(`[data-node="${nodeSlug}"]`);
      if (targetEl) {
        stage.querySelectorAll('.vis-node').forEach(n => n.classList.remove('is-focused'));
        targetEl.classList.add('is-focused');

        const boxStr = targetEl.getAttribute('data-focus-box');
        if (boxStr) {
          activeSvg.setAttribute('viewBox', boxStr);
        }
      }
    }

    function resetModalCamera() {
      const stage = document.getElementById('modal-stage');
      const currentTopo = stage.getAttribute('data-topo') || 'desktop';
      const activeSvg = currentTopo === 'mobile'
        ? (stage.querySelector('svg.vis-mobile') || stage.querySelector('svg'))
        : (stage.querySelector('svg.vis-desktop') || stage.querySelector('svg'));

      if (!activeSvg) return;
      stage.querySelectorAll('.vis-node').forEach(n => n.classList.remove('is-focused'));
      const defaultView = activeSvg.getAttribute('data-default-view') || (currentTopo === 'mobile' ? '0 0 340 540' : '0 0 780 340');
      activeSvg.setAttribute('viewBox', defaultView);
    }

    function testNodeZoom(cardId, nodeSlug) {
      openFullscreenPreview(cardId);
      setTimeout(() => zoomModalNode(nodeSlug), 150);
    }

    // --- TAB 2: QUEUE MASTER AUDIO LESSON SCRIPT ---
    async function handleQueueScript() {
      const creds = getCredentials();
      if (!creds) return;

      const courseCode = (document.getElementById('script-course-code').value || '').trim();
      const bookId = (document.getElementById('script-book-id').value || '').trim();
      const pageNum = parseInt(document.getElementById('script-page-num').value || '1', 10);
      const chapterTitle = (document.getElementById('script-chapter-title').value || '').trim();
      const sectionTitle = (document.getElementById('script-section-title').value || '').trim();
      const scriptRaw = (document.getElementById('script-text-input').value || '').trim();

      if (!bookId || !sectionTitle || !scriptRaw) {
        alert('Please fill in Book ID, Section Title, and paste the Master Script.');
        return;
      }

      const btn = document.getElementById('btn-queue-script');
      const logSummary = document.getElementById('log-summary');
      document.getElementById('log-container').innerHTML = '';
      btn.disabled = true;

      try {
        logSummary.textContent = 'Queueing Master Audio Lesson into Supabase...';

        const record = {
          book_id: bookId,
          course_code: courseCode,
          chapter_title: chapterTitle,
          section_title: sectionTitle,
          page_number: pageNum,
          script_raw: scriptRaw,
          status: 'pending',
          error_message: null,
          updated_at: new Date().toISOString()
        };

        const endpoint = `${creds.supaUrl}/rest/v1/book_audio_lessons`;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${creds.supaKey}`,
            'apikey': creds.supaKey,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(record)
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(err);
        }

        // Count cues inside the pasted script
        const visualCues = (scriptRaw.match(/\[\[(?:cue|call):(?!section)[a-zA-Z0-9_\-]+(?::[\s\S]*?)?\]\]/g) || []).length;
        const sectionCues = (scriptRaw.match(/\[\[(?:cue|call):section(?::[\s\S]*?)?\]\]/g) || []).length;

        appendLog('Master Script Queued', `Status: PENDING`, 'success');
        appendLog(`Course: ${courseCode}`, `Book: ${bookId.slice(0, 8)}...`, 'success');
        appendLog(`Structure Detected`, `${sectionCues} Sections • ${visualCues} Visual Cues`, 'success');
        logSummary.textContent = 'Success! Script is queued. Trigger GitHub Action to process audio & alignment.';
      } catch (err) {
        appendLog('Queue Failed', err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
