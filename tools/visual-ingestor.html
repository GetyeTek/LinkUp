<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>LinkUp Miron Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090e18;
      --surface: #111827;
      --surface-card: #162032;
      --border: #24324a;
      --border-light: #334464;
      --blue: #38bdf8;
      --blue-glow: rgba(56, 189, 248, 0.18);
      --green: #10b981;
      --green-dim: rgba(16, 185, 129, 0.12);
      --amber: #f59e0b;
      --red: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 1020px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    /* HEADER */
    .header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title h1 {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .brand-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green-dim);
      border: 1px solid var(--green);
      color: var(--green);
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* CARDS & INPUTS */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1.2fr 1.8fr 1fr;
      gap: 14px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: 1fr 1fr 1.5fr 1.5fr;
      gap: 14px;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }
    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 42px;
    }
    input:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 12px var(--blue-glow);
    }
    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.55;
    }

    /* BUTTONS */
    .btn {
      background: var(--blue);
      color: #090e18;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
      min-height: 42px;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.93; transform: translateY(-1px); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-green {
      background: var(--green);
      color: #042f2e;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }
    .btn-secondary {
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #1e293b;
      border-color: var(--border-light);
    }
    .btn-sm {
      padding: 7px 12px;
      font-size: 12px;
      min-height: 32px;
      border-radius: 8px;
    }

    /* NAVIGATION TABS */
    .tabs-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 5px;
      gap: 6px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      min-height: 42px;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--blue);
      color: #090e18;
      font-weight: 800;
      box-shadow: 0 3px 12px rgba(56, 189, 248, 0.35);
    }

    /* SUB SEGMENTED TOGGLE (FLUX TAB) */
    .segmented-control {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
      width: fit-content;
    }
    .segment-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .segment-btn.active {
      background: var(--surface-card);
      color: var(--blue);
      border: 1px solid var(--border-light);
    }

    /* PROGRESS BAR */
    .progress-bar-container {
      width: 100%;
      height: 7px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: var(--green);
      width: 0%;
      transition: width 0.3s;
    }

    /* ITEM GRIDS (FLUX & PREVIEW) */
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .item-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
    }
    .item-card:hover {
      border-color: var(--border-light);
    }
    .item-preview {
      height: 180px;
      background: #060911;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .item-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.25s;
    }
    .item-preview img:hover {
      transform: scale(1.03);
    }
    .item-preview .placeholder {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      padding: 12px;
    }
    .item-details {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .item-title {
      font-size: 12px;
      font-weight: 700;
      word-break: break-all;
    }
    .item-desc {
      font-size: 11px;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.45;
    }
    .item-status {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      width: fit-content;
    }
    .status-pending { background: #1e293b; color: #94a3b8; }
    .status-running { background: #1e3a8a; color: #93c5fd; }
    .status-success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-error   { background: rgba(244, 63, 94, 0.15); color: #fca5a5; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* PREVIEW GALLERY & CINEMA STAGE */
    .preview-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .preview-actions-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .view-mode-pill {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 3px;
      gap: 3px;
    }
    .mode-pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-pill-btn.active {
      background: var(--blue);
      color: #090e18;
      font-weight: 800;
    }
    .preview-count-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      background: var(--blue-glow);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .preview-gallery-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }
    .preview-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s;
    }
    .preview-card:hover {
      border-color: var(--blue);
    }
    .preview-card-header {
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .preview-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .preview-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      color: var(--blue);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .format-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .format-tag.html {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .format-tag.svg {
      background: rgba(56, 189, 248, 0.15);
      color: var(--blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .preview-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .preview-expand-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #cbd5e1;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .preview-expand-btn:hover {
      background: var(--blue);
      color: #090e18;
      border-color: var(--blue);
    }
    .preview-viewport-frame {
      width: 100%;
      min-height: 220px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .preview-card-footer {
      padding: 9px 14px;
      background: rgba(11, 17, 32, 0.6);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .node-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .node-pill:hover {
      color: var(--blue);
      border-color: var(--blue);
      background: var(--blue-glow);
    }

    /* TOPOLOGY OVERRIDES */
    .preview-viewport-frame[data-topo="desktop"] svg.vis-desktop { display: block !important; width: 100% !important; max-width: 780px !important; height: auto !important; }
    .preview-viewport-frame[data-topo="desktop"] svg.vis-mobile  { display: none !important; }
    .preview-viewport-frame[data-topo="mobile"] svg.vis-desktop  { display: none !important; }
    .preview-viewport-frame[data-topo="mobile"] svg.vis-mobile   { display: block !important; width: 100% !important; max-width: 360px !important; height: auto !important; }

    .preview-viewport-frame .vis-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
      display: flex;
      justify-content: center;
    }
    .preview-viewport-frame .vis-head { display: none !important; }
    .preview-viewport-frame .vis-box {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      width: 100% !important;
      display: flex;
      justify-content: center;
    }

    /* FULLSCREEN MODAL (CINEMA STAGE) */
    .vis-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(9, 14, 24, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
      flex-direction: column;
      animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .vis-modal-header {
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.95);
      gap: 10px;
    }
    .vis-modal-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .vis-modal-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      color: var(--blue);
      background: var(--blue-glow);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      white-space: nowrap;
    }
    .vis-modal-header h3 {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vis-modal-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .modal-close-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.15s;
    }
    .modal-close-btn:hover {
      background: rgba(244, 63, 94, 0.15);
      color: #f43f5e;
    }
    .vis-modal-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }
    .vis-modal-stage .vis-card {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      box-shadow: none !important;
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .vis-modal-stage .vis-head { display: none !important; }
    .vis-modal-stage .vis-box {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
    }
    .vis-modal-stage[data-topo="desktop"] svg.vis-desktop {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 860px !important;
      max-height: calc(100vh - 150px) !important;
    }
    .vis-modal-stage[data-topo="desktop"] svg.vis-mobile { display: none !important; }
    .vis-modal-stage[data-topo="mobile"] svg.vis-desktop { display: none !important; }
    .vis-modal-stage[data-topo="mobile"] svg.vis-mobile {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 380px !important;
      max-height: calc(100vh - 150px) !important;
    }
    .vis-modal-nodes-bar {
      padding: 10px 18px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .vis-modal-nodes-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* LIGHTBOX IMAGE MODAL (FOR FLUX IMAGES) */
    .img-lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .img-lightbox-content {
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .img-lightbox-content img {
      width: 100%;
      max-height: calc(90vh - 90px);
      object-fit: contain;
      background: #000;
    }
    .img-lightbox-footer {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
    }

    /* LOGS CONSOLE */
    .log-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 11px;
      border-radius: 6px;
      background: var(--surface-card);
      border-left: 3px solid var(--blue);
      gap: 8px;
    }
    .log-item.success { border-left-color: var(--green); }
    .log-item.error   { border-left-color: var(--red); color: #fca5a5; }

    /* ========================================================
       MOBILE FIRST RESPONSIVENESS (< 768px)
       ======================================================== */
    @media (max-width: 768px) {
      body {
        padding: 14px 10px;
      }
      .container {
        gap: 14px;
      }
      .header {
        padding: 16px 14px;
        gap: 10px;
      }
      .header h1 {
        font-size: 18px;
      }
      .tabs-nav {
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .tab-btn {
        padding: 9px 8px;
        font-size: 11px;
      }
      .card {
        padding: 16px 14px;
        gap: 14px;
      }
      .grid-2, .grid-3, .grid-4 {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .item-grid {
        grid-template-columns: 1fr;
      }
      .preview-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .preview-actions-left {
        justify-content: space-between;
      }
      .segmented-control {
        width: 100%;
      }
      .segment-btn {
        flex: 1;
        text-align: center;
      }
      .img-lightbox-footer {
        flex-direction: column;
        align-items: stretch;
      }
      .img-lightbox-footer .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <header class="header">
    <div class="brand-title">
      <div>
        <h1>⚡ LinkUp Miron Studio</h1>
        <p class="brand-desc">Interactive diagrams, Flux AI imagery, and master audio lectures.</p>
      </div>
    </div>

<script>
  const STORAGE_KEY_URL = 'miron_ingestor_supa_url';
  const STORAGE_KEY_KEY = 'miron_ingestor_supa_key';
  const STORAGE_KEY_WORKER = 'miron_flux_worker_url';
  const STORAGE_KEY_COURSE = 'miron_course_code';

  document.addEventListener('DOMContentLoaded', () => {
    const savedUrl = localStorage.getItem(STORAGE_KEY_URL);
    const savedKey = localStorage.getItem(STORAGE_KEY_KEY);
    const savedWorker = localStorage.getItem(STORAGE_KEY_WORKER);
    const savedCourse = localStorage.getItem(STORAGE_KEY_COURSE) || 'ANTH_1012';

    if (savedUrl) document.getElementById('supa-url').value = savedUrl;
    if (savedKey) document.getElementById('supa-key').value = savedKey;
    if (savedWorker) document.getElementById('global-worker-url').value = savedWorker;
    if (savedCourse) {
      document.getElementById('global-course-code').value = savedCourse;
      handleGlobalCourseChange(savedCourse);
    }
  });

  function saveCredentials() {
    const supaUrl = (document.getElementById('supa-url').value || '').trim().replace(/\/$/, '');
    const supaKey = (document.getElementById('supa-key').value || '').trim();
    const workerUrl = (document.getElementById('global-worker-url').value || '').trim().replace(/\/$/, '');
    const courseCode = (document.getElementById('global-course-code').value || '').trim();

    localStorage.setItem(STORAGE_KEY_URL, supaUrl);
    localStorage.setItem(STORAGE_KEY_KEY, supaKey);
    localStorage.setItem(STORAGE_KEY_WORKER, workerUrl);
    localStorage.setItem(STORAGE_KEY_COURSE, courseCode);
  }

  function getCredentials() {
    const supaUrl = (document.getElementById('supa-url').value || '').trim().replace(/\/$/, '');
    const supaKey = (document.getElementById('supa-key').value || '').trim();
    const workerUrl = (document.getElementById('global-worker-url').value || '').trim().replace(/\/$/, '');
    const courseCode = (document.getElementById('global-course-code').value || '').trim() || 'MISC';

    saveCredentials();
    return { supaUrl, supaKey, workerUrl, courseCode };
  }

  function handleGlobalCourseChange(val) {
    const clean = (val || '').trim();
    localStorage.setItem(STORAGE_KEY_COURSE, clean);
    const scriptCourse = document.getElementById('script-course-code');
    if (scriptCourse) scriptCourse.value = clean;
    const browsePrefix = document.getElementById('browsePrefix');
    if (browsePrefix) browsePrefix.value = clean;
  }

  function appendLog(title, subtitle, status) {
    const outputCard = document.getElementById('output-card');
    const container = document.getElementById('log-container');
    outputCard.style.display = 'flex';

    const row = document.createElement('div');
    row.className = `log-item ${status}`;
    row.innerHTML = `
      <span><strong>${title}</strong></span>
      <span style="font-size: 11px;">${subtitle}</span>
    `;
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  // --- TAB SWITCHING ---
  function switchMainTab(mode) {
    ['visuals', 'script', 'preview', 'flux'].forEach(m => {
      document.getElementById(`tab-btn-${m}`).className = `tab-btn ${mode === m ? 'active' : ''}`;
      document.getElementById(`tab-panel-${m}`).style.display = mode === m ? 'flex' : 'none';
    });

    if (mode === 'preview' && cachedParsedVisuals.length === 0) {
      renderPreviewFromInput();
    }
    if (mode === 'flux') {
      const isBrowserActive = document.getElementById('subtab-btn-browser').classList.contains('active');
      if (isBrowserActive) fetchSupabaseGallery();
    }
  }

  // ========================================================
  // TAB 1: COURSE VISUALS XML INGESTION
  // ========================================================
  function extractPayload(payloadNode) {
    if (!payloadNode) return '';
    if (payloadNode.children && payloadNode.children.length > 0) {
      const serializer = new XMLSerializer();
      return Array.from(payloadNode.childNodes)
        .map(child => serializer.serializeToString(child))
        .join('')
        .trim();
    }
    let content = payloadNode.textContent.trim();
    if (content.startsWith('<') && (content.includes('>') || content.endsWith('>'))) {
      const txt = document.createElement('textarea');
      txt.innerHTML = content;
      content = txt.value;
    }
    return content;
  }

  async function handleIngestXml() {
    const creds = getCredentials();
    if (!creds.supaUrl || !creds.supaKey) {
      alert('Please fill in Supabase URL and Service Role Key.');
      return;
    }

    const rawXml = (document.getElementById('xml-input').value || '').trim();
    if (!rawXml) return alert('Please paste the course visuals XML content.');

    const btn = document.getElementById('btn-ingest-xml');
    const logSummary = document.getElementById('log-summary');
    document.getElementById('log-container').innerHTML = '';
    btn.disabled = true;

    try {
      const sanitizedXml = rawXml.replace(/&(?!(amp|lt|gt|quot|apos|#\d+|#x[a-f\d]+);)/gi, '&');
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(sanitizedXml, 'application/xml');

      if (xmlDoc.querySelector('parsererror')) {
        throw new Error('XML parsing failed. Verify that syntax is well-formed.');
      }

      const courseCode = (xmlDoc.querySelector('course_code')?.textContent || creds.courseCode || 'GENERAL').trim();
      const infographics = Array.from(xmlDoc.querySelectorAll('infographic'));

      if (infographics.length === 0) throw new Error('No <infographic> tags found in XML.');

      logSummary.textContent = `Ingesting ${infographics.length} visual(s) for ${courseCode}...`;

      let count = 0;
      for (let i = 0; i !== infographics.length; i++) {
        const el = infographics[i];
        const id = el.getAttribute('id') || `vis_${Date.now()}_${i}`;
        const title = (el.querySelector('title')?.textContent || el.querySelector('name')?.textContent || id).trim();

        const taxNode = el.querySelector('taxonomy');
        let unitNumber = null;
        let sectionTag = null;
        let chapterTitle = null;
        let sectionTitle = null;
        let anchorQuery = null;

        if (taxNode) {
          unitNumber = taxNode.querySelector('unit_number')?.textContent ? parseInt(taxNode.querySelector('unit_number').textContent.trim(), 10) : null;
          sectionTag = taxNode.querySelector('section_tag')?.textContent?.trim() || null;
          chapterTitle = taxNode.querySelector('chapter_title')?.textContent?.trim() || null;
          sectionTitle = taxNode.querySelector('section_title')?.textContent?.trim() || null;
          anchorQuery = taxNode.querySelector('anchor_query')?.textContent?.trim() || null;
        }

        if (!sectionTag) {
          const targetQuery = (el.querySelector('routing > target_query')?.textContent || '').trim();
          const secMatch = targetQuery.match(/^([0-9]+(?:\.[0-9]+)*)/);
          sectionTag = secMatch ? secMatch[1] : null;
          if (!unitNumber && sectionTag) unitNumber = parseInt(sectionTag.split('.')[0], 10);
          anchorQuery = targetQuery;
        }

        const payloadContent = extractPayload(el.querySelector('payload'));
        const nodeMatches = Array.from(payloadContent.matchAll(/data-node=["']([^"']+)["']/g)).map(m => m[1]);
        const uniqueNodes = Array.from(new Set(nodeMatches));
        const hasSvg = payloadContent.includes('<svg');
        const assetType = hasSvg ? 'diagram_svg' : 'infographic_html';

        const record = {
          id: id,
          course_code: courseCode,
          asset_type: assetType,
          unit_number: unitNumber,
          section_tag: sectionTag,
          title: title,
          content_payload: payloadContent,
          storage_path: null,
          image_url: null,
          metadata: {
            chapter_title: chapterTitle,
            section_title: sectionTitle,
            anchor_query: anchorQuery,
            camera_nodes: uniqueNodes,
            format: assetType
          },
          updated_at: new Date().toISOString()
        };

        const endpoint = `${creds.supaUrl}/rest/v1/course_visual_assets`;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${creds.supaKey}`,
            'apikey': creds.supaKey,
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(record)
        });

        if (!res.ok) {
          const err = await res.text();
          appendLog(`[${i + 1}/${infographics.length}] ${id}`, `Error: ${err}`, 'error');
        } else {
          count++;
          appendLog(`[${i + 1}/${infographics.length}] ${id}`, `Section ${sectionTag || 'N/A'} • Saved`, 'success');
        }
      }

      logSummary.textContent = `Completed: ${count} of ${infographics.length} visuals ingested.`;
    } catch (err) {
      appendLog('Fatal Ingest Error', err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ========================================================
  // TAB 2: MASTER SCRIPT QUEUE
  // ========================================================
  async function handleQueueScript() {
    const creds = getCredentials();
    if (!creds.supaUrl || !creds.supaKey) {
      alert('Please fill in Supabase URL and Service Role Key.');
      return;
    }

    const courseCode = (document.getElementById('script-course-code').value || creds.courseCode || '').trim();
    const bookId = (document.getElementById('script-book-id').value || '').trim();
    const pageNum = parseInt(document.getElementById('script-page-num').value || '1', 10);
    const chapterTitle = (document.getElementById('script-chapter-title').value || '').trim();
    const sectionTitle = (document.getElementById('script-section-title').value || '').trim();
    const scriptRaw = (document.getElementById('script-text-input').value || '').trim();

    if (!bookId || !sectionTitle || !scriptRaw) {
      alert('Please fill in Book ID, Section Title, and paste the Master Script.');
      return;
    }

    const btn = document.getElementById('btn-queue-script');
    const logSummary = document.getElementById('log-summary');
    document.getElementById('log-container').innerHTML = '';
    btn.disabled = true;

    try {
      logSummary.textContent = 'Queueing Master Audio Lesson into Supabase...';

      const record = {
        book_id: bookId,
        course_code: courseCode,
        chapter_title: chapterTitle,
        section_title: sectionTitle,
        page_number: pageNum,
        script_raw: scriptRaw,
        status: 'pending',
        error_message: null,
        updated_at: new Date().toISOString()
      };

      const endpoint = `${creds.supaUrl}/rest/v1/book_audio_lessons`;
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${creds.supaKey}`,
          'apikey': creds.supaKey,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify(record)
      });

      if (!res.ok) throw new Error(await res.text());

      const visualCues = (scriptRaw.match(/\[\[(?:cue|call):(?!section)[a-zA-Z0-9_\-]+(?::[\s\S]*?)?\]\]/g) || []).length;
      const sectionCues = (scriptRaw.match(/\[\[(?:cue|call):section(?::[\s\S]*?)?\]\]/g) || []).length;

      appendLog('Master Script Queued', `Status: PENDING`, 'success');
      appendLog(`Course: ${courseCode}`, `Book: ${bookId.slice(0, 8)}...`, 'success');
      appendLog(`Structure Detected`, `${sectionCues} Sections • ${visualCues} Visual Cues`, 'success');
      logSummary.textContent = 'Success! Script is queued. Trigger GitHub Action to process audio & alignment.';
    } catch (err) {
      appendLog('Queue Failed', err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ========================================================
  // TAB 3: VISUAL GALLERY & 60FPS CINEMA ENGINE
  // ========================================================
  let activePreviewTopology = 'desktop';
  let cachedParsedVisuals = [];
  let cameraAnimRef = null;

  function renderPreviewFromInput() {
    const rawXml = (document.getElementById('xml-input').value || '').trim();
    const container = document.getElementById('preview-gallery-container');
    const countTag = document.getElementById('preview-count');

    if (!rawXml) {
      container.innerHTML = `
        <p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 0;">
          No XML found. Paste your <course_visuals> XML in Tab 1 first.
        </p>`;
      countTag.textContent = '0 diagrams';
      return;
    }

    try {
      const sanitizedXml = rawXml.replace(/&(?!(amp|lt|gt|quot|apos|#\d+|#x[a-f\d]+);)/gi, '&');
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(sanitizedXml, 'application/xml');

      if (xmlDoc.querySelector('parsererror')) throw new Error('XML parsing failed. Verify XML syntax in Tab 1.');

      const infographics = Array.from(xmlDoc.querySelectorAll('infographic'));
      if (infographics.length === 0) throw new Error('No <infographic> tags found in XML.');

      cachedParsedVisuals = infographics.map((el, idx) => {
        const id = el.getAttribute('id') || `vis_${idx}`;
        const title = (el.querySelector('title')?.textContent || el.querySelector('name')?.textContent || id).trim();
        const taxNode = el.querySelector('taxonomy');
        const unitNumber = taxNode?.querySelector('unit_number')?.textContent?.trim() || '';
        const sectionTag = taxNode?.querySelector('section_tag')?.textContent?.trim() || '';
        const payload = extractPayload(el.querySelector('payload'));
        const hasSvg = payload.includes('<svg');
        const nodeMatches = Array.from(payload.matchAll(/data-node=["']([^"']+)["']/g)).map(m => m[1]);
        const uniqueNodes = Array.from(new Set(nodeMatches));

        return { id, title, unitNumber, sectionTag, payload, nodes: uniqueNodes, isSvg: hasSvg };
      });

      countTag.textContent = `${cachedParsedVisuals.length} diagram(s)`;
      container.innerHTML = '';

      cachedParsedVisuals.forEach(v => {
        const card = document.createElement('div');
        card.className = 'preview-card';
        card.innerHTML = `
          <div class="preview-card-header">
            <div class="preview-card-meta">
              <span class="preview-tag">${v.sectionTag ? 'SEC ' + v.sectionTag : (v.unitNumber ? 'UNIT ' + v.unitNumber : 'VIS')}</span>
              <span class="format-tag ${v.isSvg ? 'svg' : 'html'}">${v.isSvg ? 'SVG' : 'HTML'}</span>
              <span class="preview-title" title="${v.title}">${v.title}</span>
            </div>
            <button class="preview-expand-btn" onclick="openFullscreenPreview('${v.id}')" title="Full Screen Cinema Preview">
              ⛶
            </button>
          </div>
          <div class="preview-viewport-frame" id="frame-${v.id}" data-topo="${activePreviewTopology}">
            ${v.payload}
          </div>
          <div class="preview-card-footer">
            <span style="font-size:10px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Nodes:</span>
            ${v.nodes.map(n => `<span class="node-pill" onclick="testNodeZoom('${v.id}', '${n}')">${n}</span>`).join('')}
          </div>
        `;

        card.querySelectorAll('.vis-node').forEach(nodeEl => {
          nodeEl.addEventListener('click', (e) => {
            e.stopPropagation();
            const slug = nodeEl.getAttribute('data-node');
            if (slug) testNodeZoom(v.id, slug);
          });
        });

        container.appendChild(card);
      });
    } catch (e) {
      container.innerHTML = `<div class="log-item error" style="margin: 20px 0;"><span>Error: ${e.message}</span></div>`;
    }
  }

  function setPreviewTopology(topo) {
    activePreviewTopology = topo;
    document.getElementById('btn-topo-desktop').className = `mode-pill-btn ${topo === 'desktop' ? 'active' : ''}`;
    document.getElementById('btn-topo-mobile').className = `mode-pill-btn ${topo === 'mobile' ? 'active' : ''}`;
    document.querySelectorAll('.preview-viewport-frame').forEach(el => el.setAttribute('data-topo', topo));

  function openFullscreenPreview(id) {
    const visual = cachedParsedVisuals.find(v => v.id === id);
    if (!visual) return;

    const modal = document.getElementById('vis-modal');
    const stage = document.getElementById('modal-stage');
    const badge = document.getElementById('modal-badge');
    const title = document.getElementById('modal-title');
    const nodesList = document.getElementById('modal-nodes-list');

    badge.textContent = visual.sectionTag ? `SEC ${visual.sectionTag}` : visual.id;
    title.textContent = visual.title;
    stage.innerHTML = visual.payload;
    stage.setAttribute('data-topo', activePreviewTopology);

    nodesList.innerHTML = `
      <span class="node-pill" style="color:var(--blue); border-color:var(--blue);" onclick="resetModalCamera()">↺ Overview</span>
      ${visual.nodes.map(n => `<span class="node-pill" onclick="zoomModalNode('${n}')">${n}</span>`).join('')}

  function setModalTopology(topo) {
    const stage = document.getElementById('modal-stage');

    document.getElementById('modal-btn-desktop').className = `mode-pill-btn ${topo === 'desktop' ? 'active' : ''}`;
    document.getElementById('modal-btn-mobile').className = `mode-pill-btn ${topo === 'mobile' ? 'active' : ''}`;
    resetModalCamera();
  }

  const animateViewBox = (svg, targetBoxStr) => {
    if (!svg || !targetBoxStr) return;
    const target = targetBoxStr.trim().split(/\s+/).map(Number);
    if (target.length !== 4 || target.some(isNaN)) return;

    cancelAnimationFrame(cameraAnimRef);
    const currentBoxStr = svg.getAttribute('viewBox') || targetBoxStr;
    const start = currentBoxStr.trim().split(/\s+/).map(Number);
    if (start.length !== 4 || start.some(isNaN)) {
      svg.setAttribute('viewBox', targetBoxStr);
      return;
    }

    const startTime = performance.now();
    const duration = 650;

    const step = (now) => {
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / duration);
      const ease = 1 - Math.pow(1 - progress, 3);

      const cur = [
        start[0] + (target[0] - start[0]) * ease,
        start[1] + (target[1] - start[1]) * ease,
        start[2] + (target[2] - start[2]) * ease,
        start[3] + (target[3] - start[3]) * ease
      ];

      svg.setAttribute('viewBox', `${cur[0].toFixed(2)} ${cur[1].toFixed(2)} ${cur[2].toFixed(2)} ${cur[3].toFixed(2)}`);

      if (progress < 1) cameraAnimRef = requestAnimationFrame(step);
    };
    cameraAnimRef = requestAnimationFrame(step);
  };

  function zoomModalNode(nodeSlug) {
    const stage = document.getElementById('modal-stage');
    const currentTopo = stage.getAttribute('data-topo') || 'desktop';
    const cardEl = stage.querySelector('.vis-card');
    const canvasEl = stage.querySelector('.vis-canvas') || stage.querySelector('.vis-box') || cardEl;
    if (cardEl) cardEl.setAttribute('data-active-node', nodeSlug);

    const activeSvg = currentTopo === 'mobile'
      ? (stage.querySelector('svg.vis-mobile') || stage.querySelector('svg'))
      : (stage.querySelector('svg.vis-desktop') || stage.querySelector('svg'));

    const targetEl = activeSvg
      ? (activeSvg.querySelector(`[data-node="${nodeSlug}"]`) || stage.querySelector(`[data-node="${nodeSlug}"]`))
      : stage.querySelector(`[data-node="${nodeSlug}"]`);

    if (targetEl) {
      stage.querySelectorAll('.vis-node').forEach(n => {
        n.classList.remove('is-focused');
        n.removeAttribute('data-is-active');
      });
      targetEl.classList.add('is-focused');
      targetEl.setAttribute('data-is-active', 'true');

      if (activeSvg) {
        let boxStr = targetEl.getAttribute('data-focus-box');
        if (!boxStr && typeof targetEl.getBBox === 'function') {
          try {
            const b = targetEl.getBBox();
            if (b && b.width > 0 && b.height > 0) {
              const pad = Math.max(16, Math.min(b.width, b.height) * 0.15);
              boxStr = `${(b.x - pad).toFixed(2)} ${(b.y - pad).toFixed(2)} ${(b.width + pad * 2).toFixed(2)} ${(b.height + pad * 2).toFixed(2)}`;
            }
          } catch (e) {}
        }
        if (boxStr) animateViewBox(activeSvg, boxStr);
      } else if (canvasEl) {
        const isMobile = currentTopo === 'mobile';
        const zoom = isMobile ? 1.18 : 1.35;
        const targetCenterX = targetEl.offsetLeft + (targetEl.offsetWidth / 2);
        const targetCenterY = targetEl.offsetTop + (targetEl.offsetHeight / 2);
        const stageCenterX = stage.clientWidth / 2;
        const stageCenterY = stage.clientHeight / 2;

        const moveX = (stageCenterX - targetCenterX) * 0.75;
        const moveY = (stageCenterY - targetCenterY) * 0.75;

        canvasEl.style.transformOrigin = `${targetCenterX}px ${targetCenterY}px`;
        canvasEl.style.transform = `translate3d(${moveX}px, ${moveY}px, 0) scale(${zoom})`;
      }
    }
  }

  function resetModalCamera() {
    const stage = document.getElementById('modal-stage');
    const cardEl = stage.querySelector('.vis-card');
    const canvasEl = stage.querySelector('.vis-canvas') || stage.querySelector('.vis-box') || cardEl;

    if (cardEl) cardEl.removeAttribute('data-active-node');
    if (canvasEl) {
      canvasEl.style.transform = 'none';
      canvasEl.style.transformOrigin = 'center center';
    }

    stage.querySelectorAll('.vis-node').forEach(n => {
      n.classList.remove('is-focused');
      n.removeAttribute('data-is-active');
    });

    const currentTopo = stage.getAttribute('data-topo') || 'desktop';
    const activeSvg = currentTopo === 'mobile'
      ? (stage.querySelector('svg.vis-mobile') || stage.querySelector('svg'))
      : (stage.querySelector('svg.vis-desktop') || stage.querySelector('svg'));

    if (activeSvg) {
      const defaultView = activeSvg.getAttribute('data-default-view') || (currentTopo === 'mobile' ? '0 0 340 540' : '0 0 780 340');
      animateViewBox(activeSvg, defaultView);
    }
  }

  function testNodeZoom(cardId, nodeSlug) {
    openFullscreenPreview(cardId);
    setTimeout(() => zoomModalNode(nodeSlug), 150);
  }

  // ========================================================
  // TAB 4: FLUX AI IMAGE STUDIO ENGINE
  // ========================================================
  let parsedFluxQueue = [];
  let currentFluxModalUrl = '';

  function switchFluxSubTab(subTab) {
    document.getElementById('subtab-btn-generator').className = `segment-btn ${subTab === 'generator' ? 'active' : ''}`;
    document.getElementById('subtab-btn-browser').className = `segment-btn ${subTab === 'browser' ? 'active' : ''}`;

    document.getElementById('flux-subview-generator').style.display = subTab === 'generator' ? 'flex' : 'none';
    document.getElementById('flux-subview-browser').style.display = subTab === 'browser' ? 'flex' : 'none';

    if (subTab === 'browser') {
      fetchSupabaseGallery();
    }
  }

  function parseFluxJson() {
    const raw = document.getElementById('fluxJsonInput').value.trim();
    if (!raw) return alert('Paste JSON first!');
    try {
      const parsed = JSON.parse(raw);
      if (parsed.course_code) {
        const cleanCode = parsed.course_code.replace(/\s+/g, '_');
        document.getElementById('global-course-code').value = cleanCode;
        handleGlobalCourseChange(cleanCode);
      }
      parsedFluxQueue = Array.isArray(parsed) ? parsed : (parsed.images || []);

      if (!parsedFluxQueue.length) {
        return alert('Could not find image objects in JSON. Format: [{ name, description }]');
      }

      document.getElementById('queueCount').innerText = `Queue: ${parsedFluxQueue.length} items`;
      document.getElementById('btnConcurrent').disabled = false;
      document.getElementById('btnSequential').disabled = false;

      renderFluxQueueCards();
    } catch (e) {
      alert('Invalid JSON syntax: ' + e.message);
    }
  }

  function renderFluxQueueCards() {
    const grid = document.getElementById('fluxGenerationGrid');
    grid.innerHTML = '';
    parsedFluxQueue.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.id = `flux-card-${index}`;
      card.innerHTML = `
        <div class="item-preview" id="flux-preview-${index}">
          <span class="placeholder">Waiting to generate...</span>
        </div>
        <div class="item-details">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
            <div class="item-title">${item.name || 'Image ' + (index+1)}</div>
            <span class="item-status status-pending" id="flux-status-${index}">Pending</span>
          </div>
          <div class="item-desc">${item.prompt || item.description || ''}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  async function startFluxGeneration(mode) {
    const creds = getCredentials();
    const workerUrl = creds.workerUrl;
    const courseCode = creds.courseCode;

    if (!workerUrl) return alert('Please provide the Cloudflare Worker Endpoint URL.');

    const pContainer = document.getElementById('fluxProgressContainer');
    const pBar = document.getElementById('fluxProgressBar');
    pContainer.style.display = 'block';
    pBar.style.width = '0%';

    document.getElementById('btnConcurrent').disabled = true;
    document.getElementById('btnSequential').disabled = true;

    if (mode === 'concurrent') {
      try {
        parsedFluxQueue.forEach((_, idx) => updateFluxStatus(idx, 'Generating...', 'status-running'));
        pBar.style.width = '40%';

        const res = await fetch(`${workerUrl}/api/batch-generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ course_code: courseCode, images: parsedFluxQueue })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server error');

        pBar.style.width = '100%';
        data.results.forEach((r, idx) => {
          if (r.status === 'fulfilled') {
            updateFluxSuccess(idx, r.url);
          } else {
            updateFluxStatus(idx, 'Failed: ' + (r.error || 'Error'), 'status-error');
          }
        });
      } catch (err) {
        alert('Batch Concurrent Error: ' + err.message);
        parsedFluxQueue.forEach((_, idx) => updateFluxStatus(idx, 'Failed', 'status-error'));
      }
    } else {
      let completed = 0;
      for (let i = 0; i < parsedFluxQueue.length; i++) {
        updateFluxStatus(i, 'Generating...', 'status-running');
        try {
          const item = parsedFluxQueue[i];
          const res = await fetch(`${workerUrl}/api/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              course_code: courseCode,
              name: item.name,
              prompt: item.prompt || item.description
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed');

          updateFluxSuccess(i, data.url);
        } catch (err) {
          updateFluxStatus(i, 'Error: ' + err.message, 'status-error');
        }
        completed++;
        pBar.style.width = `${Math.round((completed / parsedFluxQueue.length) * 100)}%`;
      }
    }

    document.getElementById('btnConcurrent').disabled = false;
    document.getElementById('btnSequential').disabled = false;
  }

  function updateFluxStatus(idx, text, statusClass) {
    const el = document.getElementById(`flux-status-${idx}`);
    if (el) {
      el.innerText = text;
      el.className = `item-status ${statusClass}`;
    }
  }

  function updateFluxSuccess(idx, imgUrl) {
    updateFluxStatus(idx, 'Saved to Supabase', 'status-success');
    const preview = document.getElementById(`flux-preview-${idx}`);
    if (preview) {
      preview.innerHTML = `<img src="${imgUrl}" alt="Generated" onclick="openImgModal('${imgUrl}', '${parsedFluxQueue[idx].name}')" />`;
    }
  }

  // SUPABASE STORAGE EXPLORER
  async function fetchSupabaseGallery() {
    const creds = getCredentials();
    const workerUrl = creds.workerUrl;
    const course = (document.getElementById('browsePrefix').value || creds.courseCode).trim();
    const statusEl = document.getElementById('galleryStatus');
    const grid = document.getElementById('supabaseGrid');

    if (!workerUrl) {
      statusEl.innerText = 'Please supply Cloudflare Worker endpoint above.';
      return;
    }

    statusEl.innerText = 'Connecting to Supabase Storage via Worker...';
    grid.innerHTML = '';

    try {
      const res = await fetch(`${workerUrl}/api/browse?course=${encodeURIComponent(course)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to list');

      statusEl.innerText = `Found ${data.count} image(s) in tutor_images/${data.folder}`;

      if (data.items.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); padding: 20px;">No images found in this folder yet.</p>';
        return;
      }

      data.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-preview">
            <img src="${item.url}" loading="lazy" onclick="openImgModal('${item.url}', '${item.filename}')" />
          </div>
          <div class="item-details">
            <div class="item-title">${item.filename}</div>
            <div style="font-size: 11px; color: var(--text-muted);">${(item.size / 1024).toFixed(1)} KB | ${item.storage_path}</div>
            <div style="display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap;">
              <button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText('${item.url}'); alert('Supabase CDN URL copied!')">Copy URL</button>
              <button class="btn btn-secondary btn-sm" onclick="downloadImageFile('${item.url}', '${item.filename}')">Download</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    } catch (e) {
      statusEl.innerText = 'Error: ' + e.message;
    }
  }

  // LIGHTBOX LOGIC
  function openImgModal(url, title) {
    currentFluxModalUrl = url;
    document.getElementById('img-modal-pic').src = url;
    document.getElementById('img-modal-title').innerText = title || 'Image Preview';
    document.getElementById('img-modal').style.display = 'flex';
  }

  function closeImgModal() {
    document.getElementById('img-modal').style.display = 'none';
  }

  function copyCurrentFluxUrl() {
    if (currentFluxModalUrl) {
      navigator.clipboard.writeText(currentFluxModalUrl);
      alert('Public Supabase CDN URL copied!');
    }
  }

  async function downloadImageFile(url, filename) {
    const safeName = filename || 'image.png';
    try {
      const res = await fetch(url, { mode: 'cors' });
      if (!res.ok) throw new Error('Fetch failed');
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = blobUrl;
      link.download = safeName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
    } catch (err) {
      const sep = url.includes('?') ? '&' : '?';
      const forceUrl = `${url}${sep}download=${encodeURIComponent(safeName)}`;
      const link = document.createElement('a');
      link.href = forceUrl;
      link.setAttribute('download', safeName);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  }

  function downloadCurrentFluxImage() {
    const title = document.getElementById('img-modal-title').innerText || 'image.png';
    if (currentFluxModalUrl) downloadImageFile(currentFluxModalUrl, title);
  }
