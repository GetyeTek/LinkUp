<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Course Section Slicer</title>
  <!-- JSZip for in-browser unzipping -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1f2d4a;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --level-0: #38bdf8;
      --level-1: #818cf8;
      --level-2: #c084fc;
      --level-3: #fb7185;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* --- App Bar --- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
    }

    .brand svg {
      color: var(--accent);
      flex-shrink: 0;
    }

    /* --- Upload Zone --- */
    .upload-container {
      padding: 16px;
    }

    .upload-card {
      border: 2px dashed var(--card-border);
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .upload-card:active {
      transform: scale(0.98);
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .upload-card svg {
      color: var(--accent);
      margin-bottom: 8px;
    }

    .upload-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .upload-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* --- Book List Screen --- */
    .view-container {
      padding: 0 16px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 16px 0 8px 4px;
    }

    .book-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .book-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .book-item:active {
      border-color: var(--accent);
      background: #18223a;
    }

    .book-info {
      flex: 1;
      padding-right: 12px;
    }

    .book-title {
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .book-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      background: #1e293b;
      color: var(--accent);
      border: 1px solid var(--card-border);
    }

    /* --- TOC Screen --- */
    .toc-header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .search-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      color: #fff;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .toc-tree {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Tree Node */
    .node-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
    }

    /* Selection Mode & Multi-Select */
    .select-toggle-btn.active {
      background: var(--accent) !important;
      color: #0f172a !important;
      border-color: var(--accent) !important;
    }

    .select-mode-active .copy-btn,
    .select-mode-active .icon-btn {
      pointer-events: none;
      opacity: 0.3;
    }

    .node-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid #475569;
      background: #0f172a;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .select-mode-active .node-checkbox {
      display: flex;
    }

    .node-card.selected {
      border-color: var(--accent) !important;
      background: rgba(56, 189, 248, 0.08) !important;
    }

    .node-card.selected .node-checkbox {
      background: var(--accent);
      border-color: var(--accent);
    }

    .node-checkbox svg {
      opacity: 0;
      color: #0f172a;
    }

    .node-card.selected .node-checkbox svg {
      opacity: 1;
    }

    .selection-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0b1120;
      border-top: 1px solid var(--card-border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 85;
      box-shadow: 0 -8px 25px rgba(0,0,0,0.65);
    }

    .sel-count-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-main);
      font-weight: 600;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      padding: 2px 4px;
    }

    .sel-action-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .node-content {
      flex: 1;
      min-width: 0;
    }

    .node-title {
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.35;
      color: #f8fafc;
      word-break: break-word;
    }

    .node-subtext {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .copy-btn {
      background: #0f172a;
      border: 1px solid #22d3ee;
      color: #38bdf8;
      font-weight: 600;
      font-size: 0.75rem;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .copy-btn:active {
      transform: scale(0.94);
    }

    .copy-btn.copied {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.72rem;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .icon-btn.copied {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    /* Hierarchy visual indents */
    .level-0 { margin-left: 0px; border-left: 3px solid var(--level-0); }
    .level-1 { margin-left: 12px; border-left: 3px solid var(--level-1); }
    .level-2 { margin-left: 24px; border-left: 3px solid var(--level-2); }
    .level-3 { margin-left: 36px; border-left: 3px solid var(--level-3); }
    .level-4 { margin-left: 48px; border-left: 3px solid #f59e0b; }

    /* Modal & Bottom Sheet for Transition Inspection */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: #0b1120;
      border-top: 1px solid var(--card-border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 680px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7);
    }

    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #334155;
      border-radius: 999px;
      margin: 10px auto 4px auto;
    }

    .sheet-header {
      padding: 8px 16px 12px 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .sheet-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .sheet-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .close-sheet-btn {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .close-sheet-btn:active {
      transform: scale(0.92);
      color: #fff;
    }

    .sheet-body {
      padding: 14px 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }

    .page-preview-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .page-preview-box.next-section {
      border-color: #3b4252;
      background: #0f172a;
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .box-title-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
    }

    .box-title-tag.next {
      color: #a78bfa;
    }

    .page-content-scroll {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .snippet-block {
      font-size: 0.78rem;
      line-height: 1.45;
      color: #cbd5e1;
    }

    .snippet-block.is-header {
      font-weight: 700;
      color: #38bdf8;
      margin-top: 4px;
    }

    .snippet-block.is-next-header {
      font-weight: 700;
      color: #c084fc;
      margin-top: 4px;
    }

    .sheet-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--card-border);
      background: #0f172a;
      display: flex;
      gap: 10px;
    }

    .sheet-footer .copy-btn,
    .sheet-footer .icon-btn {
      flex: 1;
      justify-content: center;
      padding: 10px 14px;
      font-size: 0.82rem;
    }

    /* --- Toast Notification --- */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      border: 1px solid var(--success);
      color: #fff;
      padding: 10px 18px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 100;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      max-width: 90%;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Utilities */
    .hidden { display: none !important; }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- App Bar -->
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Course Section Slicer</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="cacheBadge" class="badge hidden" style="color:var(--success); border-color:rgba(16,185,129,0.3);">Saved</span>
      <label class="badge" style="cursor:pointer;" for="fileInput">Change ZIP</label>
    </div>
    <input type="file" id="fileInput" accept=".zip,.txt,.json" class="hidden">
  </header>

  <!-- Upload Screen -->
  <div id="uploadView" class="upload-container">
    <div class="upload-card" onclick="document.getElementById('fileInput').click()">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <div class="upload-title">Tap to Choose ZIP File</div>
      <div class="upload-sub">Upload the course pack (e.g. books_split.zip)</div>
    </div>
  </div>

  <!-- Book List Screen -->
  <div id="booksView" class="view-container hidden">
    <div class="section-label">Available Courses (<span id="bookCount">0</span>)</div>
    <div id="bookList" class="book-grid"></div>
  </div>

  <!-- TOC Screen -->
  <div id="tocView" class="hidden">
    <div class="toc-header">
      <div class="nav-bar">
        <button class="back-btn" onclick="showBookList()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          Courses
        </button>
        <div id="activeBookTitle" style="font-weight:600; font-size:0.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;"></div>
        <button class="back-btn select-toggle-btn" id="selectModeBtn" onclick="toggleSelectMode()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Select</span>
        </button>
      </div>
      <input type="text" id="tocSearch" class="search-input" placeholder="Filter sections by title or page..." oninput="filterTOC()">
    </div>
    <div id="tocTree" class="toc-tree"></div>
  </div>

  <!-- Selection Mode Bottom Action Bar -->
  <div id="selectionActionBar" class="selection-bar hidden">
    <div class="sel-count-info">
      <span id="selectedCountText">0 selected</span>
      <button class="link-btn" onclick="toggleSelectAll()">Select All</button>
    </div>
    <div class="sel-action-btns">
      <button class="copy-btn" id="bulkCopyBtn" onclick="copySelectedSections()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>Copy Selected</span>
      </button>
      <button class="icon-btn" onclick="exitSelectMode()">Cancel</button>
    </div>
  </div>

  <!-- Page Transition Inspection Modal (Bottom Sheet) -->
  <div id="previewModal" class="modal-overlay" onclick="closePreviewModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <div class="sheet-title" id="inspectTitle">Section Transition</div>
          <div class="sheet-subtitle" id="inspectSubtitle">Comparing tail page vs start of next section</div>
        </div>
        <button class="close-sheet-btn" onclick="closePreviewModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="sheet-body" id="inspectBody"></div>
      <div class="sheet-footer">
        <button class="copy-btn" id="modalCopyBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span>Copy Normal</span>
        </button>
        <button class="icon-btn" id="modalPlusBtn" style="border-color:#38bdf8; color:#38bdf8;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>Copy +1p (Spillover)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toastMsg">Copied section JSON!</span>
  </div>

  <script>
    // Global Helper: Clean & Normalize String
    function clean(s) {
      if (!s) return "";
      return String(s).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
    }

    // Global State
    let courses = []; // { filename, data }
    let activeCourse = null;
    let flatTOC = [];
    let isSelectMode = false;
    let selectedIndices = new Set();

    const fileInput = document.getElementById('fileInput');
    const uploadView = document.getElementById('uploadView');
    const booksView = document.getElementById('booksView');
    const tocView = document.getElementById('tocView');
    const bookList = document.getElementById('bookList');
    const bookCount = document.getElementById('bookCount');
    const tocTree = document.getElementById('tocTree');
    const activeBookTitle = document.getElementById('activeBookTitle');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const cacheBadge = document.getElementById('cacheBadge');

    // --- IndexedDB Persistence Engine ---
    const DB_NAME = 'CourseSectionSlicerDB';
    const DB_STORE = 'zip_cache';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function cacheZip(fileName, arrayBuffer) {
      try {
        const db = await openDB();
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put({ fileName, buffer: arrayBuffer }, 'active_file');
      } catch (e) {
        console.warn('Could not cache file:', e);
      }
    }

    async function getCachedZip() {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction(DB_STORE, 'readonly');
          const req = tx.objectStore(DB_STORE).get('active_file');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function processFilePayload(fileOrBuffer, fileName, saveToCache = true) {
      showToast("Loading & unpacking courses...");
      try {
        courses = [];
        let buffer;
        if (fileOrBuffer instanceof ArrayBuffer) {
          buffer = fileOrBuffer;
        } else {
          buffer = await fileOrBuffer.arrayBuffer();
        }

        if (fileName.endsWith('.zip')) {
          const zip = await JSZip.loadAsync(buffer);
          const entries = Object.keys(zip.files);
          for (const name of entries) {
            if (name.includes('__MACOSX') || name.startsWith('.') || (!name.endsWith('.txt') && !name.endsWith('.json'))) {
              continue;
            }
            const content = await zip.files[name].async('string');
            try {
              const parsed = JSON.parse(content);
              if (parsed.book && parsed.pages) {
                courses.push({ filename: name.split('/').pop(), data: parsed });
              }
            } catch (err) {
              console.warn("Could not parse file as JSON:", name);
            }
          }
        } else {
          const text = new TextDecoder().decode(buffer);
          const parsed = JSON.parse(text);
          if (parsed.book && parsed.pages) {
            courses.push({ filename: fileName, data: parsed });
          }
        }

        if (courses.length === 0) {
          alert("No valid course JSON files found.");
          return;
        }

        if (saveToCache) {
          await cacheZip(fileName, buffer);
        }

        if (cacheBadge) {
          cacheBadge.classList.remove('hidden');
          cacheBadge.textContent = fileName.length > 12 ? fileName.slice(0, 10) + '…' : fileName;
        }

        renderBookList();
      } catch (err) {
        alert("Error loading file: " + err.message);
      }
    }

    // Auto-restore file from cache on reload
    window.addEventListener('DOMContentLoaded', async () => {
      const cached = await getCachedZip();
      if (cached && cached.buffer) {
        await processFilePayload(cached.buffer, cached.fileName, false);
        showToast(`Restored "${cached.fileName}"`);
      }
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await processFilePayload(file, file.name, true);
    });

    function renderBookList() {
      uploadView.classList.add('hidden');
      tocView.classList.add('hidden');
      booksView.classList.remove('hidden');

      bookCount.textContent = courses.length;
      bookList.innerHTML = '';

      courses.sort((a, b) => (a.data.book.title || a.filename).localeCompare(b.data.book.title || b.filename));

      courses.forEach((c, idx) => {

        const pages = c.data.pages || [];
        const tocLen = (book.toc || []).length;

        card.onclick = () => openCourseTOC(idx);

        card.innerHTML = `

            <div class="book-meta">

              <span>•</span>
              <span>${pages.length} Pages</span>
              ${tocLen === 0 ? '<span class="badge" style="color:#f87171;">No TOC</span>' : ''}
            </div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted);"><polyline points="9 18 15 12 9 6"/></svg>

    function showBookList() {
      exitSelectMode();
      tocView.classList.add('hidden');
      booksView.classList.remove('hidden');
    }

    // --- Unified Section Boundary Resolver ---
    function getSectionBounds(node, pages, bookMeta) {
      const boundaryNode = findNextBoundaryNode(node, bookMeta.toc || []);
      const startIdx = resolvePageIndex(node.page, pages, bookMeta);
      const rawBoundaryIdx = boundaryNode ? resolvePageIndex(boundaryNode.page, pages, bookMeta) : pages.length;

      // Intra-Page Boundary Check: Do both sections start on the exact same page?
      const isSamePageBoundary = Boolean(boundaryNode && (
        (rawBoundaryIdx !== -1 && rawBoundaryIdx === startIdx) ||
        String(boundaryNode.page).trim() === String(node.page).trim()
      ));

      let endIdx = rawBoundaryIdx;
      if (endIdx === -1 || endIdx <= startIdx) {
        endIdx = Math.min(startIdx + 1, pages.length);
      }
      const safeStart = Math.max(0, startIdx === -1 ? 0 : startIdx);
      const safeEnd = Math.max(safeStart + 1, endIdx);

      // Same-page sections can NEVER spill over to the next page because the next section began on this page!
      const hasSpillover = !isSamePageBoundary && detectTailSpillover(pages, safeEnd, boundaryNode);

      return {
        boundaryNode,
        startIdx: safeStart,
        endIdx: safeEnd,
        isSamePageBoundary,
        hasSpillover
      };
    }

    // --- Boundary Search Engine ---
    // Finds the next sibling, or walks up ancestors to find the next sibling.
    // Completely encompasses all children of targetNode.
    function findNextBoundaryNode(targetNode, tocTree) {
      function buildMaps(nodes, parent = null, parentMap = new Map(), siblingsMap = new Map()) {
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          parentMap.set(n, parent);
          siblingsMap.set(n, {
            index: i,
            nextSibling: (i + 1 < nodes.length) ? nodes[i + 1] : null
          });
          if (n.children && n.children.length > 0) {
            buildMaps(n.children, n, parentMap, siblingsMap);
          }
        }
        return { parentMap, siblingsMap };
      }

      const { parentMap, siblingsMap } = buildMaps(tocTree);

      let curr = targetNode;
      while (curr) {
        const info = siblingsMap.get(curr);
        if (info && info.nextSibling) {
          return info.nextSibling;
        }
        curr = parentMap.get(curr);
      }
      return null; // Extends to the end of the document
    }

    // Resolves a TOC page reference to the exact array index in pages[]
    function resolvePageIndex(pageVal, pages, bookMeta) {
      if (pageVal == null || !pages || pages.length === 0) return 0;
      const targetStr = String(pageVal).trim().toLowerCase();
      const offset = Number(bookMeta.page_offset) || 0;

      // 1. Try printed footer match
      for (let i = 0; i < pages.length; i++) {
        for (const item of (pages[i].content_json || [])) {
          if (item && item.type && item.type.toLowerCase().includes('footer') && item.val != null) {
            if (String(item.val).trim().toLowerCase() === targetStr) {
              return i;
            }
          }
        }
      }

      // 2. Try canvas page_number match
      for (let i = 0; i < pages.length; i++) {
        if (String(pages[i].page_number).trim() === targetStr) {
          return i;
        }
      }

      // 3. Try offset-calculated match (canvas - offset)
      if (/^\d+$/.test(targetStr)) {
        const num = parseInt(targetStr, 10);
        for (let i = 0; i < pages.length; i++) {
          if (Number(pages[i].page_number) - offset === num) {
            return i;
          }
        }
      }

      return -1;
    }

    // --- TOC Hierarchical Rendering ---
    function openCourseTOC(courseIdx) {
      activeCourse = courses[courseIdx];
      const book = activeCourse.data.book;
      const pages = activeCourse.data.pages || [];
      const tocTreeNodes = book.toc || [];

      exitSelectMode();
      activeBookTitle.textContent = book.title || activeCourse.filename;
      booksView.classList.add('hidden');
      tocView.classList.remove('hidden');

      if (tocTreeNodes.length === 0) {
        tocTree.innerHTML = `
          <div style="text-align:center; padding:40px 16px; color:var(--text-muted);">
            No Table of Contents in this book.<br><br>
            <button class="copy-btn" style="margin:auto;" onclick="copyEntireBook()">Copy Full Book JSON</button>
          </div>
        `;
        return;
      }

      // Flatten tree preserving hierarchy level, reference, and original index
      flatTOC = [];
      function walk(nodes, depth = 0) {
        for (const n of nodes) {
          flatTOC.push({ node: n, depth, origIdx: flatTOC.length });
          if (n.children && n.children.length > 0) {
            walk(n.children, depth + 1);
          }
        }
      }
      walk(tocTreeNodes);

      renderTOCTree(flatTOC);
    }

    // --- Empirical 19-Course Schema Engine ---
    const CONFIRMED_ANCHOR_TYPES = new Set([
      "header", "mced-sub-header", "chem-sub-header", "emte-sub-header", "entre-sub-header",
      "glaf-sub-header", "math-sub-header", "geog-sub-header", "psych-sub-header", "phys-sub-header",
      "spsc-sub-header", "econ-sub-header", "flen-sub-header", "chem-review", "flen2-part-header",
      "econ-review", "emte-chapter-header", "geog-chapter-header", "geog-review-box",
      "emte-review-questions", "history-unit-header", "entre-review", "phys-chapter-header",
      "unit-outcomes", "flen2-unit-title", "econ-summary", "glaf-chapter-header", "glaf-exercise",
      "mced-chapter-header", "spsc-chapter-header", "flen-chapter-header", "math-chapter-header",
      "flen2-sub-header", "flen2-reading-header", "section-header", "unit-header",
      "chem-chapter-header", "chapter-title", "mced-activity", "entre-chapter-header"
    ]);

    // The Inverted Rule: only layout padding is benign; everything else is substantive curriculum content
    function isBenignBlock(b) {
      if (!b) return true;
      const bType = String(b.type || "").toLowerCase();
      return bType.includes("spacer") || bType.includes("footer") || bType.includes("blank-line");
    }

    function isBoundaryHeader(block, boundaryTitle) {
      if (!block || !boundaryTitle) return false;
      const bType = String(block.type || "").toLowerCase();
      const isKnownAnchor = CONFIRMED_ANCHOR_TYPES.has(bType) ||
        bType.includes("header") || bType.includes("title") || bType.includes("sub") ||
        bType.includes("review") || bType.includes("summary") || bType.includes("exercise");

      if (!isKnownAnchor) return false;

      const headerText = clean(block.body || block.title || block.label || "").toLowerCase();
      const targetText = clean(boundaryTitle).toLowerCase();

      if (headerText === targetText) return true;

      const stripPrefix = (str) => str.replace(/^(?:(?:chapter|unit)[\s\-]+[0-9a-zivxlcdm]+|(?:\d+(?:\.\s*\d+)*))[:\.\s\-]*/i, "").trim();
      const normH = stripPrefix(headerText);
      const normT = stripPrefix(targetText);

      return Boolean(normH && normT && (normH === normT || normH.includes(normT) || normT.includes(normH)));
    }

    function detectTailSpillover(pages, safeEnd, boundaryNode) {
      if (!pages || safeEnd >= pages.length || !boundaryNode) {
        return false;
      }

      const boundaryPage = pages[safeEnd];
      const blocks = boundaryPage.content_json || [];
      if (blocks.length === 0) return false;

      const boundaryTitle = boundaryNode.title || "";
      let boundaryIndex = -1;

      // 1. Locate the exact block where the next section begins
      for (let i = 0; i < blocks.length; i++) {
        if (isBoundaryHeader(blocks[i], boundaryTitle)) {
          boundaryIndex = i;
          break;
        }
      }

      // 2. If boundary header is found on page:
      // Any non-benign block before it means Section N has a tail
      if (boundaryIndex !== -1) {
        for (let i = 0; i < boundaryIndex; i++) {
          if (!isBenignBlock(blocks[i])) {
            return true;
          }
        }
        return false;
      }

      // 3. Fallback: If boundary title wasn't found by exact name,
      // check if any confirmed anchor header sits lower down on the page
      let firstHeaderIdx = -1;
      for (let i = 0; i < blocks.length; i++) {
        const bType = String(blocks[i].type || "").toLowerCase();
        if (CONFIRMED_ANCHOR_TYPES.has(bType) || bType.includes("header") || bType.includes("title") || bType.includes("chap") || bType.includes("unit")) {
          firstHeaderIdx = i;
          break;
        }
      }

      if (firstHeaderIdx > 0) {
        for (let i = 0; i < firstHeaderIdx; i++) {
          if (!isBenignBlock(blocks[i])) {
            return true;
          }
        }
      }

      return false;
    }

    function renderTOCTree(items) {
      tocTree.innerHTML = '';
      const pages = activeCourse.data.pages || [];
      const bookMeta = activeCourse.data.book;

      items.forEach((entry, idx) => {
        const { node, depth } = entry;
        const entryIdx = entry.origIdx !== undefined ? entry.origIdx : idx;
        const bounds = getSectionBounds(node, pages, bookMeta);

        const effectiveEnd = bounds.hasSpillover ? Math.min(pages.length, bounds.endIdx + 1) : bounds.endIdx;
        const pageSpanCount = effectiveEnd - bounds.startIdx;
        const isSelected = selectedIndices.has(entryIdx);

        const card = document.createElement('div');
        const levelClass = `level-${Math.min(depth, 4)}`;
        card.className = `node-card ${levelClass}${isSelected ? ' selected' : ''}`;
        card.id = `node-card-${entryIdx}`;
        card.style.cursor = 'pointer';

        card.onclick = (e) => {
          if (isSelectMode) {
            toggleCardSelection(entryIdx);
          } else {
            inspectSectionPages(entryIdx);
          }
        };

        let badgeHtml = '';
        if (bounds.isSamePageBoundary) {
          badgeHtml = `<span class="badge" style="color:#e2e8f0; border-color:#475569; background:#1e293b;">Same Page Cut</span>`;
        } else if (bounds.hasSpillover) {
          badgeHtml = `<span class="badge" style="color:#38bdf8; border-color:#0284c7; background:rgba(56,189,248,0.12);">+1p Tail Auto</span>`;
        } else {
          badgeHtml = `<span class="badge" style="color:var(--success); border-color:rgba(16,185,129,0.3); background:rgba(16,185,129,0.08);">Clean Cut</span>`;
        }

        card.innerHTML = `
          <div class="node-checkbox">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="node-content">
            <div class="node-title">${node.title}</div>
            <div class="node-subtext">
              <span>Start: p.${node.page}</span>
              <span>•</span>
              <span>${pageSpanCount} Page${pageSpanCount > 1 ? 's' : ''}</span>
              <span>•</span>
              ${badgeHtml}
            </div>
          </div>
          <div class="btn-group">
            <button class="copy-btn" id="btn-${entryIdx}" onclick="copySectionJSON(event, ${entryIdx})" title="Copy Section JSON (Auto-captures tail if spilled)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <span>Copy</span>
            </button>
            <button class="icon-btn" id="btn-plus-${entryIdx}" onclick="copySectionJSON(event, ${entryIdx}, 1)" title="Force add +1 page beyond current boundary">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>+1p</span>
            </button>
          </div>
        `;
        tocTree.appendChild(card);
      });
    }

    function filterTOC() {
      const q = document.getElementById('tocSearch').value.toLowerCase().trim();
      if (!q) {
        renderTOCTree(flatTOC);
        return;
      }
      const filtered = flatTOC.filter(e => 
        e.node.title.toLowerCase().includes(q) || String(e.node.page).includes(q)
      );
      renderTOCTree(filtered);
    }

    // --- Action: Slice & Copy JSON ---
    async function copySectionJSON(event, entryIdx, extraPages = null) {
      if (event) event.stopPropagation();
      const entry = flatTOC[entryIdx];
      const node = entry.node;
      const pages = activeCourse.data.pages || [];
      const book = activeCourse.data.book;

      // Use unified boundary resolver with same-page protection
      const bounds = getSectionBounds(node, pages, book);

      let appliedExtra = 0;
      if (extraPages !== null) {
        appliedExtra = extraPages;
      } else if (bounds.hasSpillover) {
        appliedExtra = 1;
      }

      let safeEnd = bounds.endIdx;
      if (appliedExtra > 0) {
        safeEnd = Math.min(pages.length, safeEnd + appliedExtra);
      }

      // Slice all encompassed pages
      const slicedPages = pages.slice(bounds.startIdx, safeEnd);

      // 4. Construct complete section JSON payload
      const payload = {
        book: {
          id: book.id,
          title: book.title,
          course_code: book.course_code,
          page_offset: book.page_offset,
          selected_section: node.title,
          section_start_page: node.page,
          section_end_page: bounds.boundaryNode ? bounds.boundaryNode.page : (pages[pages.length - 1]?.page_number || "End"),
          same_page_boundary: bounds.isSamePageBoundary,
          tail_spillover_detected: bounds.hasSpillover,
          extra_pages_appended: appliedExtra
        },
        section_node: node,
        page_count: slicedPages.length,
        pages: slicedPages
      };

      const jsonStr = JSON.stringify(payload, null, 2);

      // 5. Copy to clipboard
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(jsonStr);
        } else {
          // Fallback for older mobile WebViews
          const ta = document.createElement("textarea");
          ta.value = jsonStr;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }

        // Haptic feedback if supported
        if (navigator.vibrate) navigator.vibrate(40);

        // Visual button feedback
        const targetBtn = document.getElementById((extraPages === 1) ? `btn-plus-${entryIdx}` : `btn-${entryIdx}`);
        if (targetBtn) {
          targetBtn.classList.add('copied');
          const origHTML = targetBtn.innerHTML;
          targetBtn.innerHTML = (extraPages === 1)
            ? `<span>✓ +1p</span>`
            : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg><span>Copied!</span>`;

          setTimeout(() => {
            targetBtn.classList.remove('copied');
            targetBtn.innerHTML = origHTML;
          }, 1800);
        }

        const spillMsg = (appliedExtra > 0) ? ` (Tail included, ${slicedPages.length} pgs)` : ` (${slicedPages.length} pgs)`;
        showToast(`Copied "${node.title.slice(0, 20)}..."${spillMsg}`);

      } catch (err) {
        alert("Failed to copy to clipboard: " + err.message);
      }
    }

    function copyEntireBook() {
      if (!activeCourse) return;
      navigator.clipboard.writeText(JSON.stringify(activeCourse.data, null, 2));
      showToast("Copied entire book JSON!");
    }

    // --- Page Transition Inspector (Last Page vs Next Section Start) ---
    function inspectSectionPages(entryIdx) {
      const entry = flatTOC[entryIdx];
      const node = entry.node;
      const pages = activeCourse.data.pages || [];
      const book = activeCourse.data.book;

      const boundaryNode = findNextBoundaryNode(node, book.toc || []);
      const startIdx = resolvePageIndex(node.page, pages, book);
      let endIdx = boundaryNode ? resolvePageIndex(boundaryNode.page, pages, book) : pages.length;

      if (endIdx === -1 || endIdx <= startIdx) {
        endIdx = Math.min(startIdx + 1, pages.length);
      }
      const safeStart = Math.max(0, startIdx === -1 ? 0 : startIdx);
      const safeEnd = Math.max(safeStart + 1, endIdx);

      const bounds = getSectionBounds(node, pages, book);

      // Page 1: Last page of current section
      const lastPageIdx = bounds.endIdx - 1;
      const lastPage = pages[lastPageIdx];

      // Page 2: Start page of next section
      const hasNextPage = bounds.endIdx < pages.length;
      const nextStartPage = hasNextPage ? pages[bounds.endIdx] : null;

      let statusMsg = '';
      if (bounds.isSamePageBoundary) {
        statusMsg = '<span style="color:#e2e8f0; font-weight:600;">Next section shares this exact same page (Same-Page Cut)</span>';
      } else if (bounds.hasSpillover) {
        statusMsg = '<span style="color:#38bdf8; font-weight:600;">Tail spillover detected on next page</span>';
      } else {
        statusMsg = '<span style="color:var(--success); font-weight:600;">Clean cut (starts at top of next page)</span>';
      }

      // Update sheet header
      document.getElementById('inspectTitle').textContent = node.title;
      document.getElementById('inspectSubtitle').innerHTML = `
        Spans ${bounds.endIdx - bounds.startIdx} page(s) (p.${node.page} to p.${lastPage ? getPageLabel(lastPage) : '?'}) • ${statusMsg}
      `;

      // Render inspector cards
      const bodyEl = document.getElementById('inspectBody');
      bodyEl.innerHTML = `
        <!-- Box 1: Section Last Page -->
        <div class="page-preview-box">
          <div class="box-header">
            <span class="box-title-tag">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              <span>Last Page of Selected Section</span>
            </span>
            <span class="badge">Footer p.${getPageLabel(lastPage)} (Canvas ${lastPage ? lastPage.page_number : '?'})</span>
          </div>
          <div class="page-content-scroll">
            ${renderPageBlocksHTML(lastPage)}
          </div>
        </div>

        <!-- Box 2: Next Section First Page -->
        <div class="page-preview-box next-section">
          <div class="box-header">
            <span class="box-title-tag next">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span>Start Page of Next Section: "${boundaryNode ? boundaryNode.title.slice(0, 32) + '…' : 'End of Book'}"</span>
            </span>
            ${nextStartPage ? `<span class="badge" style="color:#a78bfa; border-color:#4c1d95;">Footer p.${getPageLabel(nextStartPage)} (Canvas ${nextStartPage.page_number})</span>` : '<span class="badge">End of Book</span>'}
          </div>
          <div class="page-content-scroll">
            ${nextStartPage ? renderPageBlocksHTML(nextStartPage, true) : '<div style="color:var(--text-muted); font-size:0.8rem; padding:10px;">This is the final section of the book. No subsequent pages exist.</div>'}
          </div>
        </div>
      `;

      // Setup Modal Action Buttons
      const modalCopyBtn = document.getElementById('modalCopyBtn');
      const modalPlusBtn = document.getElementById('modalPlusBtn');

      modalCopyBtn.onclick = (e) => {
        copySectionJSON(e, entryIdx, 0);
        closePreviewModal();
      };

      modalPlusBtn.onclick = (e) => {
        copySectionJSON(e, entryIdx, 1);
        closePreviewModal();
      };

      document.getElementById('previewModal').classList.add('active');
    }

    function closePreviewModal(e) {
      document.getElementById('previewModal').classList.remove('active');
    }

    function getPageLabel(page) {
      if (!page) return '?';
      for (const item of (page.content_json || [])) {
        if (item && item.type && item.type.toLowerCase().includes('footer') && item.val != null) {
          return item.val;
        }
      }
      return page.page_number;
    }

    function renderPageBlocksHTML(page, isNext = false) {
      if (!page || !page.content_json || page.content_json.length === 0) {
        return '<div style="color:var(--text-muted); font-size:0.75rem;">(No text blocks on this page)</div>';
      }
      return page.content_json.map(item => {
        const body = clean(item.body || item.title || item.label || '');
        if (!body) return '';
        const itype = (item.type || '').toLowerCase();
        const isHead = itype.includes('header') || itype.includes('title') || itype.includes('sub');
        const cls = isHead ? (isNext ? 'snippet-block is-next-header' : 'snippet-block is-header') : 'snippet-block';
        return `<div class="${cls}"><strong>[${item.type}]</strong> ${body}</div>`;
      }).filter(Boolean).join('');
    }

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    // --- Selection Mode Logic ---
    function toggleSelectMode() {
      isSelectMode = !isSelectMode;
      selectedIndices.clear();
      updateSelectModeUI();
    }

    function exitSelectMode() {
      isSelectMode = false;
      selectedIndices.clear();
      updateSelectModeUI();
    }

    function updateSelectModeUI() {
      const btn = document.getElementById('selectModeBtn');
      const bar = document.getElementById('selectionActionBar');
      const tocViewEl = document.getElementById('tocView');

      if (isSelectMode) {
        btn.classList.add('active');
        btn.innerHTML = `<span>Exit</span>`;
        bar.classList.remove('hidden');
        tocViewEl.classList.add('select-mode-active');
      } else {
        btn.classList.remove('active');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Select</span>
        `;
        bar.classList.add('hidden');
        tocViewEl.classList.remove('select-mode-active');
        document.querySelectorAll('.node-card.selected').forEach(el => el.classList.remove('selected'));
      }
      updateSelectedCount();
    }

    function toggleCardSelection(entryIdx) {
      const card = document.getElementById(`node-card-${entryIdx}`);
      if (selectedIndices.has(entryIdx)) {
        selectedIndices.delete(entryIdx);
        if (card) card.classList.remove('selected');
      } else {
        selectedIndices.add(entryIdx);
        if (card) card.classList.add('selected');
      }
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const countEl = document.getElementById('selectedCountText');
      if (countEl) {
        countEl.textContent = `${selectedIndices.size} selected`;
      }
    }

    function toggleSelectAll() {
      const allSelected = flatTOC.every(e => selectedIndices.has(e.origIdx));
      if (allSelected) {
        selectedIndices.clear();
      } else {
        flatTOC.forEach(e => selectedIndices.add(e.origIdx));
      }
      renderTOCTree(flatTOC);
      updateSelectModeUI();
    }

    async function copySelectedSections() {
      if (selectedIndices.size === 0) {
        showToast("No sections selected");
        return;
      }

      const pages = activeCourse.data.pages || [];
      const book = activeCourse.data.book;

      const sortedIndices = Array.from(selectedIndices).sort((a, b) => a - b);
      const sectionsPayload = [];
      const includedPageIndices = new Set();

      for (const idx of sortedIndices) {
        const entry = flatTOC[idx];
        if (!entry) continue;
        const node = entry.node;
        const bounds = getSectionBounds(node, pages, book);

        let safeEnd = bounds.endIdx;
        if (bounds.hasSpillover) {
          safeEnd = Math.min(pages.length, safeEnd + 1);
        }

        const slicedPages = pages.slice(bounds.startIdx, safeEnd);
        for (let i = bounds.startIdx; i < safeEnd; i++) {
          includedPageIndices.add(i);
        }

        sectionsPayload.push({
          section_title: node.title,
          section_start_page: node.page,
          section_end_page: bounds.boundaryNode ? bounds.boundaryNode.page : (pages[pages.length - 1]?.page_number || "End"),
          page_count: slicedPages.length,
          same_page_boundary: bounds.isSamePageBoundary,
          tail_spillover_detected: bounds.hasSpillover,
          section_node: node,
          pages: slicedPages
        });
      }

      const sortedPageIndices = Array.from(includedPageIndices).sort((a, b) => a - b);
      const allDeduplicatedPages = sortedPageIndices.map(i => pages[i]);

      const bundlePayload = {
        book: {
          id: book.id,
          title: book.title,
          course_code: book.course_code,
          page_offset: book.page_offset,
          total_sections_selected: sectionsPayload.length,
          total_unique_pages: allDeduplicatedPages.length
        },
        sections: sectionsPayload,
        combined_pages: allDeduplicatedPages
      };

      const jsonStr = JSON.stringify(bundlePayload, null, 2);

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(jsonStr);
        } else {
          const ta = document.createElement("textarea");
          ta.value = jsonStr;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }

        if (navigator.vibrate) navigator.vibrate([40, 30, 40]);
        showToast(`Copied ${sectionsPayload.length} sections (${allDeduplicatedPages.length} unique pages)!`);
        exitSelectMode();
      } catch (err) {
        alert("Failed to copy selected sections: " + err.message);
      }
    }
  </script>
